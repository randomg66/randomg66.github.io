<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Фортуны — Premium Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        
        :root{
            --h:218;
            --h-alt:280;
            --bg:hsl(var(--h) 42% 5%);
            --bg-deep:hsl(var(--h) 45% 2%);
            --acc:hsl(var(--h) 58% 54%);
            --acc-l:hsl(var(--h) 68% 78%);
            --acc-xl:hsl(var(--h) 72% 90%);
            --acc-d:hsl(var(--h) 48% 35%);
            --glow:hsla(var(--h) 80% 60%/.45);
            --glow-intense:hsla(var(--h) 70% 65%/.7);
            --glass:hsla(var(--h) 50% 70%/.12);
            --glass-b:hsla(var(--h) 45% 65%/.16);
            --txt:hsl(var(--h) 25% 92%);
            --txt-m:hsla(var(--h) 22% 72%/.5);
            --wh:min(420px,78vw);
            --rare-gold:hsl(45 80% 55%);
            --bloom-intensity:1;
        }
        
        [data-theme="ocean"] { --h:200; --h-alt:180; }
        [data-theme="sunset"] { --h:25; --h-alt:340; }
        [data-theme="forest"] { --h:140; --h-alt:100; }
        [data-theme="royal"] { --h:270; --h-alt:320; }
        [data-theme="cyber"] { --h:320; --h-alt:180; }
        
        html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
        body{
            font-family:'Montserrat',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background-color: var(--tg-theme-bg-color, var(--bg));
            color: var(--tg-theme-text-color, var(--txt));
            overflow-x:hidden;
            overflow-y:auto;
        }

        /* Background Layers - Optimized */
        .bg{position:fixed;inset:0;z-index:0;background:
            radial-gradient(ellipse 130% 90% at 15% 5%,hsla(var(--h) 48% 16%/.55),transparent),
            radial-gradient(ellipse 110% 100% at 85% 95%,hsla(var(--h) 38% 10%/.6),transparent),
            linear-gradient(155deg,hsl(var(--h) 42% 5%),hsl(var(--h) 36% 9%));
            transition:filter 1s ease;
        }
        .bg.spinning{filter:hue-rotate(10deg) brightness(1.1)}
        .bg.jackpot{filter:hue-rotate(-20deg) brightness(1.3)}
        .bg.bullet-time{filter:hue-rotate(5deg) saturate(1.4) brightness(1.1)}
        
        /* Effects Containers - GPU Accelerated */
        .neon-signs-container{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 1s;}
        .neon-signs-container.active{opacity:1}
        .neon-sign{position:absolute;font-family:'Montserrat',sans-serif;font-weight:900;text-transform:uppercase;animation:neonFlicker 3s ease-in-out infinite;will-change:opacity;}
        .neon-sign-1{top:8%;left:5%;font-size:clamp(14px,2vw,24px);color:hsl(320 100% 60%);text-shadow:0 0 10px hsl(320 100% 60%),0 0 20px hsl(320 100% 60%);transform:rotate(-5deg);}
        .neon-sign-2{top:12%;right:8%;font-size:clamp(12px,1.8vw,20px);color:hsl(180 100% 50%);text-shadow:0 0 10px hsl(180 100% 50%);transform:rotate(3deg);}
        
        .cyber-rain-container{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity 1s;overflow:hidden;}
        .cyber-rain-container.active{opacity:1}
        
        .holo-ads-container{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 1s;}
        .holo-ads-container.active{opacity:1}
        .holo-ad{position:absolute;padding:10px 20px;background:linear-gradient(135deg,hsla(180 100% 50%/.1),hsla(320 100% 60%/.1));border:1px solid hsla(180 100% 50%/.3);border-radius:8px;animation:holoFloat 8s ease-in-out infinite;will-change:transform;}
        
        .glitch-overlay{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;mix-blend-mode:screen;will-change:transform;}
        .glitch-overlay.active{opacity:1;animation:glitchMain 0.3s steps(2) infinite;}
        
        .scanlines{position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,transparent,transparent 2px,hsla(0 0% 0%/.03) 2px,hsla(0 0% 0%/.03) 4px);opacity:0;transition:opacity 1s;}
        .scanlines.active{opacity:1}
        
        /* Elements */
        .bloom-layer{position:fixed;inset:0;z-index:1;pointer-events:none;filter:blur(80px) brightness(calc(var(--bloom-intensity) * 1.5));opacity:.4;mix-blend-mode:screen;transition:opacity .5s, filter .5s;will-change:filter;}
        .bloom-source{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--acc-l),transparent)}
        
        .parallax-bg{position:fixed;inset:0;z-index:0;will-change:transform;}
        .orb{position:fixed;border-radius:50%;filter:blur(100px);z-index:0;will-change:transform,opacity}
        .o1{width:600px;height:600px;background:hsla(var(--h) 50% 22%/.2);top:-20%;left:-14%;animation:oF1 30s ease-in-out infinite alternate}
        .o2{width:500px;height:500px;background:hsla(var(--h) 55% 28%/.16);bottom:-16%;right:-10%;animation:oF2 24s ease-in-out infinite alternate-reverse}
        
        .noise{position:fixed;inset:0;z-index:0;opacity:.022;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px}
        .grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(hsla(var(--h) 40% 45%/.02) 1px,transparent 1px),linear-gradient(90deg,hsla(var(--h) 40% 45%/.02) 1px,transparent 1px);background-size:72px 72px;animation:gridMove 60s linear infinite}
        
        .stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .star{position:absolute;width:2px;height:2px;background:var(--acc-l);border-radius:50%;opacity:0;animation:starPulse 4s ease-in-out infinite;will-change:opacity;}
        
        .crystals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .crystal{position:absolute;opacity:0;will-change:transform,opacity;animation:crystalFloat 25s ease-in-out infinite}
        .crystal-shape{clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);background:linear-gradient(135deg,hsla(var(--h) 50% 75%/.12),hsla(var(--h) 60% 85%/.06))}

        /* Pointer */
        .ptr{
            position:absolute;top:-42px;left:50%;transform:translateX(-50%);z-index:20;
            filter:drop-shadow(0 8px 35px var(--glow));transform-origin:50% 85%;
            animation:ptrIdle 3s ease-in-out infinite;transition:filter .2s;
            will-change:transform;
        }
        @keyframes ptrIdle{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) rotate(1deg)}}
        .ptr.stopped{animation:ptrMorph .6s cubic-bezier(.175,.885,.32,1.275) forwards}
        .ptr.bullet-time{animation:ptrBulletTime 0.5s ease-in-out infinite;}
        
        .ptr-body{width:40px;height:54px;position:relative;transition:all .3s ease}
        .ptr-shape{width:100%;height:100%;transition:all .3s ease}
        .ptr[data-shape="triangle"] .ptr-shape{clip-path:polygon(50% 100%,0 0,100% 0);background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88))}
        .ptr[data-shape="diamond"] .ptr-shape{clip-path:polygon(50% 100%,0 40%,50% 0,100% 40%);background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88))}
        .ptr[data-shape="arrow"] .ptr-shape{clip-path:polygon(50% 100%,20% 30%,35% 30%,35% 0,65% 0,65% 30%,80% 30%);background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88))}
        .ptr[data-shape="claw"] .ptr-shape{clip-path:polygon(50% 100%,30% 20%,35% 0,45% 15%,50% 0,55% 15%,65% 0,70% 20%);background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88))}
        .ptr[data-shape="crystal"] .ptr-shape{clip-path:polygon(50% 100%,15% 35%,30% 0,50% 15%,70% 0,85% 35%);background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88))}
        .ptr[data-shape="sword"] .ptr-shape{clip-path:polygon(50% 100%,45% 15%,40% 0,50% 5%,60% 0,55% 15%);background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88))}
        
        .ptr-hi{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:16px;height:24px;clip-path:polygon(50% 100%,10% 0,90% 0);background:linear-gradient(180deg,rgba(255,255,255,.6),transparent);animation:ptrGlow 2s ease-in-out infinite}
        .ptr-glow{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--glow);filter:blur(10px);animation:pG 2.4s ease-in-out infinite}

        /* Wheel Wrapper */
        .wh-wrap{position:relative;width:var(--wh);height:var(--wh);opacity:0;animation:fadeUp 1s cubic-bezier(.22,.6,.36,1) forwards .35s;contain:layout paint style;}
        
        /* Ring - Optimized for GPU */
        .ring{
            position:absolute;inset:-30px;border-radius:50%;
            background:linear-gradient(135deg,hsla(var(--h) 50% 58%/.08),hsla(var(--h) 40% 38%/.02) 40%,hsla(var(--h) 50% 58%/.06));
            border:1px solid var(--glass-b);
            box-shadow:0 0 80px hsla(var(--h) 55% 28%/.15), inset 0 0 80px hsla(var(--h) 55% 28%/.06);
            /* Removed backdrop-filter for performance */
            animation:ringPulse 4s ease-in-out infinite;transition:box-shadow .3s;
            will-change:box-shadow;
            contain:strict;
        }
        .ring.spinning{box-shadow:0 0 120px hsla(var(--h) 55% 28%/.25), inset 0 0 80px hsla(var(--h) 55% 28%/.06)}
        @keyframes ringPulse{0%,100%{box-shadow:0 0 80px hsla(var(--h) 55% 28%/.15), inset 0 0 80px hsla(var(--h) 55% 28%/.06)}50%{box-shadow:0 0 100px hsla(var(--h) 55% 28%/.22), inset 0 0 100px hsla(var(--h) 55% 28%/.08)}}

        .leds{position:absolute;inset:-30px;border-radius:50%;pointer-events:none}
        .led{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--acc-l);opacity:.08;transition:opacity .1s,box-shadow .1s,transform .12s;will-change:opacity,transform;}
        .led.on{opacity:1;box-shadow:0 0 15px var(--glow),0 0 30px hsla(var(--h) 70% 60%/.25);transform:scale(1.4)}

        .rotor{position:absolute;inset:0;border-radius:50%;will-change:transform;contain:strict;}
        .cv{width:100%;height:100%;border-radius:50%;display:block}
        .in-sh{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 80px hsla(var(--h) 42% 4%/.5);pointer-events:none;z-index:3}
        .gloss{position:absolute;inset:0;border-radius:50%;background:linear-gradient(165deg,hsla(var(--h) 60% 90%/.08) 0%,transparent 35%);pointer-events:none;z-index:3}

        .hub{
            position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:85px;height:85px;border-radius:50%;z-index:10;
            background:linear-gradient(145deg,hsla(var(--h) 38% 22%/.92),hsla(var(--h) 34% 10%/.98));
            border:1px solid hsla(var(--h) 50% 58%/.2);
            box-shadow:0 0 60px hsla(var(--h) 48% 22%/.3),inset 0 2px 0 hsla(0 0% 100%/.1);
            display:flex;align-items:center;justify-content:center;animation:hubFloat 6s ease-in-out infinite;
            contain:strict;
        }
        .hub::after{content:'';position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,var(--acc-xl),var(--acc));box-shadow:0 0 25px var(--glow);animation:hubP 3s ease-in-out infinite}

        .burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-radius:50%;background:radial-gradient(circle,hsla(var(--h) 70% 68%/.25),transparent 70%);pointer-events:none;z-index:4;transition:width 1.5s cubic-bezier(.1,.8,.1,1),height 1.5s cubic-bezier(.1,.8,.1,1);will-change:width,height;}
        .burst.on{width:850px;height:850px}
        
        .btn{
            position:relative;padding:20px 70px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;
            letter-spacing:6px;text-transform:uppercase;color:var(--txt);cursor:pointer;z-index:1;
            background:linear-gradient(135deg,hsla(var(--h) 44% 28%/.5),hsla(var(--h) 38% 16%/.6));
            border:1px solid var(--glass-b);border-radius:60px;
            box-shadow:0 12px 40px hsla(var(--h) 48% 14%/.3),inset 0 1px 0 hsla(0 0% 100%/.08);
            transition:all .4s ease;overflow:hidden;opacity:0;
            animation:fadeUp 1s cubic-bezier(.22,.6,.36,1) forwards .5s;margin-top:48px;
            backdrop-filter:blur(15px); /* Only on static button */
        }
        .btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 18px 55px hsla(var(--h) 55% 18%/.4);border-color:hsla(var(--h) 48% 68%/.3);color:#fff}
        .btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

        /* Modal */
        .m-ov{
            position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
            background:hsla(var(--h) 42% 8%/.85);backdrop-filter:blur(30px) saturate(1.2);
            opacity:0;pointer-events:none;transition:opacity .5s ease;
        }
        .m-ov.open{opacity:1;pointer-events:all;}
        .m-c{
            text-align:center;padding:55px 65px 50px;border-radius:32px;max-width:440px;width:90vw;
            position:relative;overflow:hidden;
            background:linear-gradient(165deg,hsla(var(--h) 38% 22%/.75),hsla(var(--h) 34% 10%/.85));
            border:1px solid hsla(var(--h) 48% 58%/.2);
            box-shadow:0 40px 120px hsla(var(--h) 38% 5%/.5);
            transform:scale(.75) translateY(60px);transition:transform .65s cubic-bezier(.175,.885,.32,1.275);
        }
        .m-ov.open .m-c{transform:scale(1) translateY(0)}
        .m-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--acc);padding:10px 26px;border:1px solid hsla(var(--h) 48% 55%/.2);border-radius:50px;margin-bottom:32px;background:hsla(var(--h) 48% 48%/.08)}
        .m-val{font-size:clamp(26px,7vw,40px);font-weight:900;line-height:1.2;margin-bottom:14px;letter-spacing:2px}
        .m-val.rv{background:linear-gradient(135deg,var(--rare-gold),#fff,var(--rare-gold));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px hsla(45 90% 60%/.3));animation:mShine 3s linear infinite}
        .m-sub{font-size:13px;font-weight:400;color:var(--txt-m);margin-bottom:40px}
        .m-btn{padding:16px 55px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--acc-l);background:hsla(var(--h) 42% 32%/.25);border:1px solid hsla(var(--h) 48% 55%/.18);border-radius:55px;cursor:pointer;transition:all .35s ease}
        .m-btn:hover{background:hsla(var(--h) 48% 38%/.35);color:#fff;transform:translateY(-2px)}

        .counter{position:fixed;top:18px;right:22px;z-index:50;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--txt-m);letter-spacing:2px;opacity:0;animation:fadeUp 1s cubic-bezier(.22,.6,.36,1) forwards .7s;transform:translateY(20px)}
        .counter-val{color:var(--acc-l);font-weight:800;font-size:15px;min-width:26px;text-align:center;background:hsla(var(--h) 45% 30%/.28);padding:5px 12px;border-radius:22px;border:1px solid hsla(var(--h) 50% 55%/.12)}

        .fx{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
        .confetti{position:absolute;will-change:transform,opacity}
        
        /* Animations */
        @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
        @keyframes oF1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(55px,-80px) scale(1.1)}}
        @keyframes oF2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-70px,40px) scale(1.15)}}
        @keyframes neonFlicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:0.8}94%{opacity:1}}
        @keyframes holoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes glitchMain{0%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}100%{transform:translateX(0)}}
        @keyframes starPulse{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.8;transform:scale(1)}}
        @keyframes crystalFloat{0%,100%{opacity:0;transform:translateY(100vh) rotate(0deg)}50%{opacity:1;transform:translateY(50vh) rotate(180deg)}}
        @keyframes hubFloat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.02)}}
        @keyframes hubP{0%,100%{box-shadow:0 0 25px var(--glow)}50%{box-shadow:0 0 45px var(--glow)}}
        @keyframes ptrMorph{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
        @keyframes ptrBulletTime{0%,100%{filter:drop-shadow(0 8px 35px var(--glow))}50%{filter:drop-shadow(0 12px 50px var(--glow-intense))}}
        @keyframes pG{0%,100%{opacity:.3;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(2.2)}}
        @keyframes ptrGlow{0%,100%{opacity:.6}50%{opacity:1}}
        @keyframes mShine{0%{background-position:200% center}100%{background-position:-200% center}}
        @keyframes gridMove{to{background-position:72px 72px}}
        
        /* Theme Selector UI */
        .theme-selector{position:fixed;top:18px;left:22px;z-index:50;display:flex;gap:8px;opacity:0;animation:fadeUp 1s cubic-bezier(.22,.6,.36,1) forwards .7s;}
        .theme-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--glass-b);cursor:pointer;transition:all .3s;position:relative;overflow:hidden;}
        .theme-btn:hover{transform:scale(1.15);border-color:var(--acc)}
        .theme-btn.active{border-color:var(--acc-l);box-shadow:0 0 15px var(--glow)}
        .theme-btn::before{content:'';position:absolute;inset:3px;border-radius:50%}
        .theme-btn[data-theme="default"]::before{background:linear-gradient(135deg,hsl(218 58% 54%),hsl(218 48% 35%))}
        .theme-btn[data-theme="ocean"]::before{background:linear-gradient(135deg,hsl(200 58% 54%),hsl(180 48% 35%))}
        .theme-btn[data-theme="sunset"]::before{background:linear-gradient(135deg,hsl(25 58% 54%),hsl(340 48% 35%))}
        .theme-btn[data-theme="forest"]::before{background:linear-gradient(135deg,hsl(140 58% 54%),hsl(100 48% 35%))}
        .theme-btn[data-theme="royal"]::before{background:linear-gradient(135deg,hsl(270 58% 54%),hsl(320 48% 35%))}
        .theme-btn[data-theme="cyber"]::before{background:linear-gradient(135deg,hsl(320 58% 54%),hsl(180 48% 35%))}

        .pointer-customizer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:10px;padding:10px 16px;background:hsla(var(--h) 40% 10%/.85);backdrop-filter:blur(20px);border-radius:16px;border:1px solid var(--glass-b);opacity:0;animation:fadeUp 1s cubic-bezier(.22,.6,.36,1) forwards .9s;}
        .ptr-shape-btn{width:36px;height:36px;border-radius:10px;border:2px solid transparent;background:hsla(var(--h) 50% 30%/.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;}
        .ptr-shape-btn:hover{transform:scale(1.1)}
        .ptr-shape-btn.active{border-color:var(--acc-l)}
        .ptr-shape-btn svg{width:20px;height:20px;fill:var(--txt)}

        @media(max-width:480px){
            .main{padding-top:5px;padding-bottom:80px}.m-c{padding:40px 28px 35px}
            .hdr h1{font-size:clamp(18px,5vw,28px);letter-spacing:3px}
            .wh-wrap{--wh:min(300px,75vw)}.btn{padding:16px 40px;font-size:11px;letter-spacing:4px;margin-top:32px}
            .ring{inset:-22px}.leds{inset:-22px}
            .hub{width:65px;height:65px}
            .theme-selector{left:10px;top:8px}.theme-btn{width:26px;height:26px}
            .pointer-customizer{bottom:10px;padding:8px 12px;gap:8px}
        }
    </style>
</head>
<body>

<div class="parallax-bg" id="parallaxBg">
    <div class="bg" id="bg"></div>
    <div class="orb o1"></div><div class="orb o2"></div>
</div>
<div class="noise"></div>
<div class="grid"></div>
<div class="stars" id="stars"></div>
<div class="crystals" id="crystals"></div>

<!-- Neon/Effects containers -->
<div class="neon-signs-container" id="neonSigns">
    <div class="neon-sign neon-sign-1">CYBER</div>
    <div class="neon-sign neon-sign-2">FORTUNE</div>
</div>
<div class="cyber-rain-container" id="cyberRain"></div>
<div class="holo-ads-container" id="holoAds"></div>
<div class="glitch-overlay" id="glitchOverlay"></div>
<div class="scanlines" id="scanlines"></div>
<div class="bloom-layer" id="bloomLayer">
    <div class="bloom-source" id="bloomSource" style="width:300px;height:300px;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
</div>

<!-- UI Controls -->
<div class="theme-selector">
    <div class="theme-btn active" data-theme="default" title="Стандартная"></div>
    <div class="theme-btn" data-theme="ocean" title="Океан"></div>
    <div class="theme-btn" data-theme="sunset" title="Закат"></div>
    <div class="theme-btn" data-theme="forest" title="Лес"></div>
    <div class="theme-btn" data-theme="royal" title="Королевская"></div>
    <div class="theme-btn" data-theme="cyber" title="Киберпанк"></div>
</div>

<div class="counter">
    <span>Осталось</span>
    <span class="counter-val" id="spinsLeft">1</span>
</div>

<div class="main">
    <div class="hdr">
        <h1>Колесо Фортуны</h1>
        <p class="sub">Испытай свою удачу</p>
    </div>

    <div class="wh-wrap" id="whWrap">
        <div class="ring" id="ring"></div>
        <div class="leds" id="leds"></div>
        
        <div class="ptr" id="ptr" data-shape="triangle">
            <div class="ptr-body"><div class="ptr-shape"></div></div>
            <div class="ptr-hi"></div>
            <div class="ptr-glow"></div>
        </div>
        
        <div class="rotor" id="rotor">
            <canvas class="cv" id="cv"></canvas>
        </div>
        <div class="in-sh"></div>
        <div class="gloss"></div>
        <div class="burst" id="burst"></div>
        <div class="hub"></div>
    </div>

    <button class="btn" id="btnSpin">Крутить</button>
</div>

<div class="pointer-customizer">
    <button class="ptr-shape-btn active" data-shape="triangle" title="Треугольник"><svg viewBox="0 0 24 24"><polygon points="12,22 2,4 22,4"/></svg></button>
    <button class="ptr-shape-btn" data-shape="diamond" title="Ромб"><svg viewBox="0 0 24 24"><polygon points="12,22 2,12 12,2 22,12"/></svg></button>
    <button class="ptr-shape-btn" data-shape="arrow" title="Стрела"><svg viewBox="0 0 24 24"><polygon points="12,22 4,10 8,10 8,2 16,2 16,10 20,10"/></svg></button>
    <button class="ptr-shape-btn" data-shape="crystal" title="Кристалл"><svg viewBox="0 0 24 24"><polygon points="12,22 4,12 8,2 16,2 20,12"/></svg></button>
</div>

<!-- Modal -->
<div class="m-ov" id="mOv">
    <div class="m-c">
        <div class="m-tag" id="mTag">🎁 Ваш приз</div>
        <div class="m-val" id="mVal">Приз</div>
        <div class="m-sub" id="mSub">Описание приза</div>
        <button class="m-btn" id="mBtn">Забрать</button>
    </div>
</div>

<div class="fx" id="fx"></div>

<script>
/* =====================================================
   CONFIG & STATE
   ===================================================== */
const PRIZES = [
    {id: "10d", label: "10 D", w: 35, desc: "Небольшой бонус", d: 10, rarity: "common"},
    {id: "25d", label: "25 D", w: 28, desc: "Приятный подарок", d: 25, rarity: "common"},
    {id: "50d", label: "50 D", w: 20, desc: "Хороший выигрыш", d: 50, rarity: "common"},
    {id: "250d", label: "250 D", w: 10, desc: "Отличный приз!", d: 250, rarity: "rare"},
    {id: "premium_1d", label: "+1 день Premium", w: 6, desc: "Пробный доступ", d: 120, rarity: "rare"},
    {id: "premium_7d", label: "+7 дней Premium", w: 2, desc: "Невероятная удача!", d: 600, rarity: "epic"},
    {id: "discount_15",label: "Скидка 15%", w: 12, desc: "На Premium", d: 200, rarity: "rare"},
];

const N = PRIZES.length;
const ARC = (Math.PI * 2) / N;
const SEG_ANGLE = 360 / N;

let H = 218;
let currentAngle = 0;
let isSpinning = false;
let targetAngle = 0;
let animationId = null;
let S;
let canSpin = true;

/* =====================================================
   TELEGRAM WEB APP
   ===================================================== */
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
const API_URL = 'https://squaretoed-overfloridly-alonzo.ngrok-free.dev'; // REPLACE WITH YOUR URL

/* =====================================================
   DOM REFS
   ===================================================== */
const cv = document.getElementById('cv');
const c = cv.getContext('2d');
const rotor = document.getElementById('rotor');
const btnSp = document.getElementById('btnSpin');
const ptr = document.getElementById('ptr');
const bg = document.getElementById('bg');
const ring = document.getElementById('ring');
const bloomLayer = document.getElementById('bloomLayer');
const burst = document.getElementById('burst');
const mOv = document.getElementById('mOv');
const mTag = document.getElementById('mTag');
const mVal = document.getElementById('mVal');
const mSub = document.getElementById('mSub');
const mBtn = document.getElementById('mBtn');
const fxEl = document.getElementById('fx');
const whWrap = document.getElementById('whWrap');
const neonSigns = document.getElementById('neonSigns');
const cyberRain = document.getElementById('cyberRain');
const glitchOverlay = document.getElementById('glitchOverlay');
const scanlines = document.getElementById('scanlines');

/* =====================================================
   PARTICLES SETUP (Optimized)
   ===================================================== */
// Reduced star count
const starsEl = document.getElementById('stars');
for (let i = 0; i < 15; i++) { // Reduced from 20
    const star = document.createElement('div');
    star.className = 'star';
    star.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s`;
    starsEl.appendChild(star);
}

// Reduced crystal count
const crystalsEl = document.getElementById('crystals');
for (let i = 0; i < 8; i++) { // Reduced from 16
    const crystal = document.createElement('div');
    crystal.className = 'crystal';
    const size = 12 + Math.random() * 15;
    crystal.innerHTML = `<div class="crystal-shape" style="width:${size}px;height:${size*1.4}px"></div>`;
    crystal.style.cssText = `left:${5+Math.random()*90}%;animation-delay:${Math.random()*25}s`;
    crystalsEl.appendChild(crystal);
}

/* =====================================================
   THEMES
   ===================================================== */
document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (isSpinning) return;
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.dataset.theme;
        document.body.dataset.theme = theme === 'default' ? '' : theme;
        H = {ocean:200, sunset:25, forest:140, royal:270, cyber:320}[theme] || 218;
        draw();
        
        // Toggle Cyberpunk effects
        const isCyber = theme === 'cyber';
        neonSigns.classList.toggle('active', isCyber);
        scanlines.classList.toggle('active', isCyber);
        if(isCyber) startCyberRain(); else stopCyberRain();
    });
});

/* =====================================================
   WHEEL DRAWING
   ===================================================== */
function initCv() {
    const b = cv.parentElement.getBoundingClientRect();
    S = Math.round(b.width);
    const d = Math.min(devicePixelRatio || 1, 2); // Cap DRP at 2 for perf
    cv.width = S * d;
    cv.height = S * d;
    cv.style.width = S + 'px';
    cv.style.height = S + 'px';
    c.setTransform(d, 0, 0, d, 0, 0);
    draw();
}

function segCol(i, rarity) {
    if (rarity === 'epic') return { g1: `hsla(45 80% 90% / .95)`, g2: `hsla(50 75% 80% / .9)`, t: `hsl(280 60% 15%)` };
    if (rarity === 'rare') return { g1: `hsla(${H} 65% 90% / .92)`, g2: `hsla(${H} 60% 80% / .88)`, t: `hsl(${H} 60% 12%)` };
    const v = [{l:14,s:45,a:.75},{l:18,s:42,a:.68}][i % 2];
    return { g1: `hsla(${H} ${v.s}% ${v.l}% / ${v.a})`, g2: `hsla(${H} ${v.s+5}% ${v.l-3}% / ${v.a+.05})`, t: `hsl(${H} 55% 75%)` };
}

function draw() {
    const cx = S / 2, cy = S / 2, R = S / 2;
    c.clearRect(0, 0, S, S);
    PRIZES.forEach((p, i) => {
        const a0 = i * ARC - Math.PI / 2;
        const a1 = a0 + ARC;
        const mid = a0 + ARC / 2;
        const cl = segCol(i, p.rarity);
        
        const gx = cx + R * .5 * Math.cos(mid);
        const gy = cy + R * .5 * Math.sin(mid);
        const g = c.createRadialGradient(cx, cy, R * .15, gx, gy, R);
        g.addColorStop(0, cl.g2);
        g.addColorStop(1, cl.g1);
        
        c.beginPath();
        c.moveTo(cx, cy);
        c.arc(cx, cy, R - 2, a0, a1);
        c.closePath();
        c.fillStyle = g;
        c.fill();

        // Text
        c.save();
        c.translate(cx, cy);
        c.rotate(mid);
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillStyle = cl.t;
        const fontSize = Math.round(S * .03);
        c.font = `700 ${fontSize}px Montserrat`;
        c.fillText(p.label, R * .65, 0);
        c.restore();
    });
}

/* =====================================================
   LEDS (Optimized)
   ===================================================== */
const ledsEl = document.getElementById('leds');
const NL = 36; // Reduced from 60
let ledA = [];
let ledIv, ledIdx = 0;

function initLEDs() {
    ledA.forEach(l => l.remove());
    ledA = [];
    const rr = ledsEl.offsetWidth / 2 || 230;
    for (let i = 0; i < NL; i++) {
        const a = (i / NL) * 360;
        const d = document.createElement('div');
        d.className = 'led';
        const rad = (a - 90) * Math.PI / 180;
        d.style.transform = `translate(${(rr - 14) * Math.cos(rad) - 2.5}px, ${(rr - 14) * Math.sin(rad) - 2.5}px)`;
        ledsEl.appendChild(d);
        ledA.push(d);
    }
}

function ledsGo(speed) {
    clearInterval(ledIv);
    ledIv = setInterval(() => {
        ledA.forEach(d => d.classList.remove('on'));
        for (let j = 0; j < 3; j++) ledA[(ledIdx + j) % NL].classList.add('on');
        ledIdx += 2;
    }, speed);
}
function ledsStop() { clearInterval(ledIv); ledA.forEach(d => d.classList.remove('on')); ledIdx = 0; }

/* =====================================================
   AUDIO (Optimized)
   ===================================================== */
let actx;
function initAudio() {
    if (!actx) actx = new (AudioContext || webkitAudioContext)();
}

function tick(freq = 1600, vol = .03, dur = .04) {
    if(!actx) return;
    try {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = 'sine';
        o.frequency.value = freq;
        g.gain.value = vol;
        g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
        o.connect(g);
        g.connect(actx.destination);
        o.start();
        o.stop(actx.currentTime + dur);
    } catch(e) {}
}

function winSound() { initAudio(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tick(f, .05, .12), i * 80)); }

/* =====================================================
   LOGIC & ANIMATION
   ===================================================== */
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

async function onSpinClick(e) {
    if (isSpinning || !canSpin) return;
    canSpin = false;
    initAudio(); // Unlock audio on user interaction

    // Request prize
    let result;
    try {
        const response = await fetch(API_URL + '/wheel/spin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({init_data: tg.initData})
        });
        if (!response.ok) {
            const err = await response.json();
            tg.showAlert(err.error === 'already_spun' ? '⏰ Вы уже крутили сегодня!' : 'Ошибка');
            canSpin = true; // Reset if error
            return;
        }
        result = await response.json();
    } catch (err) {
        tg.showAlert('Нет связи с сервером');
        canSpin = true;
        return;
    }

    // Start spin animation
    isSpinning = true;
    btnSp.disabled = true;
    bg.classList.add('spinning');
    ring.classList.add('spinning');
    bloomLayer.classList.add('active');

    // Calculate target
    const winIdx = result.prize_index;
    const randomOffset = (0.2 + Math.random() * 0.6) * SEG_ANGLE;
    const prizeAngleOnWheel = winIdx * SEG_ANGLE + randomOffset;
    let targetStopAngle = 360 - prizeAngleOnWheel;
    
    const fullRotations = 5 + Math.floor(Math.random() * 2);
    targetAngle = currentAngle + fullRotations * 360 + (targetStopAngle - (currentAngle % 360));
    
    const startAngle = currentAngle;
    const startTime = performance.now();
    const duration = 5500;

    ledsGo(30);

    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutQuart(progress);
        
        currentAngle = startAngle + (targetAngle - startAngle) * eased;
        rotor.style.transform = `rotate(${currentAngle}deg)`;

        // Tick sound & pointer bounce
        const normAngle = ((currentAngle % 360) + 360) % 360;
        const currentSeg = Math.floor(normAngle / SEG_ANGLE);
        if (!animate.lastSeg || currentSeg !== animate.lastSeg) {
            animate.lastSeg = currentSeg;
            tick(800 + (1-eased)*600, 0.02 + eased*0.02, 0.05);
            ptr.style.transform = `translateX(-50%) rotate(${5}deg)`;
            setTimeout(()=>ptr.style.transform = `translateX(-50%) rotate(0deg)`, 30);
        }

        if (progress < 1) {
            animationId = requestAnimationFrame(animate);
        } else {
            finishSpin(winIdx);
        }
    }
    animate.lastSeg = -1;
    animationId = requestAnimationFrame(animate);
}

function finishSpin(prizeIndex) {
    isSpinning = false;
    ledsStop();
    bg.classList.remove('spinning');
    ring.classList.remove('spinning');
    bloomLayer.classList.remove('active');
    
    const prize = PRIZES[prizeIndex];
    
    // Effects
    if(prize.rarity === 'epic' || prize.rarity === 'rare') {
        burst.classList.add('on');
        fireConfetti(80);
    } else {
        fireConfetti(30);
    }
    
    winSound();
    
    // Show modal
    setTimeout(() => showModal(prize), 300);
    
    // Send data
    tg.sendData(JSON.stringify({ action: 'wheel_result', prize_id: prize.id }));
}

function showModal(prize) {
    mTag.textContent = prize.rarity === 'epic' ? '🏆 Эпический приз!' : prize.rarity === 'rare' ? '💎 Редкий приз!' : '🎁 Ваш приз';
    mVal.textContent = prize.label;
    mVal.className = 'm-val ' + (prize.rarity !== 'common' ? 'rv' : 'cv');
    mSub.textContent = prize.desc;
    mOv.classList.add('open');
}

function closeModal() {
    mOv.classList.remove('open');
    burst.classList.remove('on');
}
mBtn.addEventListener('click', closeModal);
mOv.addEventListener('click', e => { if (e.target === mOv) closeModal(); });

/* =====================================================
   VISUAL EFFECTS (Confetti & Rain)
   ===================================================== */
function fireConfetti(count) {
    const palette = [`hsl(${H} 65% 75%)`, '#fff', `hsl(${H} 55% 60%)`];
    for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        const size = 4 + Math.random() * 6;
        el.style.cssText = `width:${size}px;height:${size}px;background:${palette[i%palette.length]};left:50%;top:50%;border-radius:50%;`;
        fxEl.appendChild(el);
        const angle = Math.random() * 360;
        const vel = 200 + Math.random() * 300;
        const dx = Math.cos(angle * Math.PI / 180) * vel;
        const dy = Math.sin(angle * Math.PI / 180) * vel - 100;
        
        el.animate([
            {transform:'translate(-50%,-50%) translate(0,0) scale(1)', opacity:1},
            {transform:`translate(-50%,-50%) translate(${dx}px,${dy+300}px) scale(0)`, opacity:0}
        ], {duration: 1500, easing: 'cubic-bezier(0, .9, .1, 1)', fill: 'forwards'});
        
        setTimeout(() => el.remove(), 1500);
    }
}

/* Cyber Rain */
let cyberInterval;
function startCyberRain() {
    cyberRain.classList.add('active');
    glitchOverlay.classList.add('active');
    if(cyberInterval) return;
    cyberInterval = setInterval(() => {
        const drop = document.createElement('div');
        drop.style.cssText = `position:absolute;width:1px;height:15px;background:hsla(180 100% 50%/.6);left:${Math.random()*100}%;top:-20px;opacity:0.8;`;
        cyberRain.appendChild(drop);
        drop.animate([{transform:'translateY(0)'},{transform:`translateY(${window.innerHeight+40}px)`, opacity:0}], {duration: 600, easing: 'linear'});
        setTimeout(() => drop.remove(), 600);
    }, 50);
}

function stopCyberRain() {
    cyberRain.classList.remove('active');
    glitchOverlay.classList.remove('active');
    clearInterval(cyberInterval);
    cyberInterval = null;
}

/* Pointer Customizer */
document.querySelectorAll('.ptr-shape-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.ptr-shape-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ptr.dataset.shape = btn.dataset.shape;
    });
});

/* INIT */
addEventListener('DOMContentLoaded', () => { 
    initCv(); 
    initLEDs();
    // Check initial spin status
    fetch(API_URL + '/wheel/check', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({init_data: tg.initData})
    }).then(r => r.json()).then(d => {
        if (!d.can_spin) {
            btnSp.disabled = true;
            btnSp.textContent = 'Приходите завтра';
        }
    }).catch(e=>console.log("Check failed", e));
});

let resizeTimer;
addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if(!isSpinning) {
            initCv();
            initLEDs();
            rotor.style.transform = `rotate(${currentAngle}deg)`;
        }
    }, 200);
});

btnSp.addEventListener('click', onSpinClick);
</script>
</body>
</html>
