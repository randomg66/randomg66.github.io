<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Фортуны</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

        :root{
            --h:218;
            --bg:hsl(var(--h) 42% 5%);
            --acc:hsl(var(--h) 58% 54%);
            --acc-l:hsl(var(--h) 68% 78%);
            --acc-xl:hsl(var(--h) 72% 90%);
            --glow:hsla(var(--h) 80% 60%/.45);
            --glass-b:hsla(var(--h) 45% 65%/.16);
            --txt:hsl(var(--h) 25% 92%);
            --txt-m:hsla(var(--h) 22% 72%/.5);
            --wh:min(420px,78vw);
            --rare-gold:hsl(45 80% 55%);
        }

        [data-theme="ocean"]{--h:200}
        [data-theme="sunset"]{--h:25}
        [data-theme="forest"]{--h:140}
        [data-theme="royal"]{--h:270}
        [data-theme="cyber"]{--h:320}

        html{-webkit-font-smoothing:antialiased}
        body{
            font-family:'Montserrat',sans-serif;
            min-height:100vh;min-height:100dvh;
            display:flex;align-items:center;justify-content:center;
            background:var(--bg);
            overflow:hidden;
            color:var(--txt);
            -webkit-tap-highlight-color:transparent;
            -webkit-user-select:none;user-select:none;
        }

        /* ====== ФОН — минимум слоёв ====== */
        .bg{
            position:fixed;inset:0;z-index:0;
            background:
                radial-gradient(ellipse 130% 90% at 15% 5%,hsla(var(--h) 48% 16%/.55),transparent),
                radial-gradient(ellipse 110% 100% at 85% 95%,hsla(var(--h) 38% 10%/.6),transparent),
                linear-gradient(155deg,hsl(var(--h) 42% 5%),hsl(var(--h) 36% 9%));
            contain:strict;
        }

        .orb{
            position:fixed;border-radius:50%;
            filter:blur(100px);z-index:0;
            contain:strict;
        }
        .o1{width:600px;height:600px;background:hsla(var(--h) 50% 22%/.18);top:-20%;left:-14%;animation:oF1 30s ease-in-out infinite alternate}
        .o2{width:450px;height:450px;background:hsla(var(--h) 55% 28%/.14);bottom:-16%;right:-10%;animation:oF2 24s ease-in-out infinite alternate-reverse}
        @keyframes oF1{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(30px,-30px,0)}}
        @keyframes oF2{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-20px,20px,0)}}

        .noise{
            position:fixed;inset:0;z-index:0;opacity:.02;pointer-events:none;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size:128px;contain:strict;
        }

        .stars{position:fixed;inset:0;z-index:0;pointer-events:none;contain:strict;overflow:hidden}
        .star{
            position:absolute;width:2px;height:2px;
            background:var(--acc-l);border-radius:50%;
            opacity:0;animation:starP 4s ease-in-out infinite;
            contain:strict;
        }
        @keyframes starP{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.7;transform:scale(1)}}

        /* ====== ГЛАВНЫЙ КОНТЕЙНЕР ====== */
        .main{
            position:relative;z-index:1;
            display:flex;flex-direction:column;align-items:center;
            padding:20px;
            opacity:0;animation:mainIn .8s ease forwards .1s;
        }
        @keyframes mainIn{to{opacity:1}}

        /* ====== ЗАГОЛОВОК ====== */
        .hdr{text-align:center;margin-bottom:12px}
        .hdr h1{
            font-size:clamp(20px,5vw,36px);font-weight:900;
            letter-spacing:4px;text-transform:uppercase;
            background:linear-gradient(100deg,hsla(var(--h) 35% 58%/.6),var(--txt) 28%,#fff 50%,var(--txt) 72%,hsla(var(--h) 35% 58%/.6));
            background-size:280% 100%;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            animation:tSh 8s linear infinite;
            filter:drop-shadow(0 2px 20px hsla(var(--h) 60% 50%/.2));
        }
        @keyframes tSh{0%{background-position:280% center}100%{background-position:-280% center}}
        .hdr .sub{
            font-size:9px;font-weight:500;color:var(--txt-m);
            letter-spacing:8px;text-transform:uppercase;margin-top:4px;
        }

        /* ====== КОЛЕСО ====== */
        .wh-wrap{
            position:relative;width:var(--wh);height:var(--wh);
            contain:layout size;
        }

        .ring{
            position:absolute;inset:-28px;border-radius:50%;
            background:linear-gradient(135deg,hsla(var(--h) 50% 58%/.08),hsla(var(--h) 40% 38%/.02) 40%,hsla(var(--h) 50% 58%/.06));
            border:1px solid var(--glass-b);
            box-shadow:0 0 80px hsla(var(--h) 55% 28%/.12),inset 0 0 60px hsla(var(--h) 55% 28%/.05);
            transition:box-shadow .5s;
            contain:strict;
        }
        .ring.glow{
            box-shadow:0 0 120px hsla(var(--h) 55% 28%/.2),0 0 60px hsla(var(--h) 55% 35%/.12),inset 0 0 80px hsla(var(--h) 55% 28%/.06);
        }

        /* LEDs */
        .leds{position:absolute;inset:-28px;border-radius:50%;pointer-events:none;contain:strict}
        .led{
            position:absolute;width:5px;height:5px;border-radius:50%;
            background:var(--acc-l);opacity:.08;
            top:50%;left:50%;
            transition:none;
            contain:strict;
        }
        .led.on{
            opacity:1;
            box-shadow:0 0 12px var(--glow),0 0 24px hsla(var(--h) 70% 60%/.2);
            transform:scale(1.3);
        }
        .led.dim{opacity:.4;transform:scale(1.1)}

        /* РОТОР */
        .rotor{
            position:absolute;inset:0;border-radius:50%;
            will-change:transform;
            transform:translate3d(0,0,0);
            contain:layout size;
        }
        .cv{width:100%;height:100%;border-radius:50%;display:block}

        /* Тени и блик */
        .in-sh{
            position:absolute;inset:0;border-radius:50%;
            box-shadow:inset 0 0 60px hsla(var(--h) 42% 4%/.4),inset 0 -8px 30px hsla(var(--h) 42% 4%/.25);
            pointer-events:none;z-index:3;contain:strict;
        }
        .gloss{
            position:absolute;inset:0;border-radius:50%;
            background:linear-gradient(165deg,hsla(var(--h) 60% 90%/.07) 0%,transparent 35%);
            pointer-events:none;z-index:3;contain:strict;
        }

        /* УКАЗАТЕЛЬ */
        .ptr{
            position:absolute;top:-38px;left:50%;
            transform:translate3d(-50%,0,0);z-index:20;
            filter:drop-shadow(0 6px 25px var(--glow));
            will-change:transform;
            contain:layout;
        }
        .ptr-body{width:36px;height:48px;position:relative}
        .ptr-shape{
            width:100%;height:100%;
            clip-path:polygon(50% 100%,0 0,100% 0);
            background:linear-gradient(180deg,var(--acc-l),hsla(var(--h) 52% 50%/.88));
        }
        .ptr-shape::before{
            content:'';position:absolute;inset:3px;
            clip-path:polygon(50% 100%,0 0,100% 0);
            background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 60%);
        }
        .ptr-glow{
            position:absolute;bottom:-12px;left:50%;
            transform:translateX(-50%);
            width:20px;height:20px;border-radius:50%;
            background:var(--glow);filter:blur(8px);
            animation:pG 2.4s ease-in-out infinite;
        }
        @keyframes pG{0%,100%{opacity:.3;transform:translateX(-50%) scale(1)}50%{opacity:.8;transform:translateX(-50%) scale(2)}}

        /* ХАБ */
        .hub{
            position:absolute;top:50%;left:50%;
            transform:translate3d(-50%,-50%,0);
            width:80px;height:80px;border-radius:50%;z-index:10;
            background:linear-gradient(145deg,hsla(var(--h) 38% 22%/.92),hsla(var(--h) 34% 10%/.98));
            border:1px solid hsla(var(--h) 50% 58%/.2);
            box-shadow:0 0 40px hsla(var(--h) 48% 22%/.25),inset 0 2px 0 hsla(0 0% 100%/.08),inset 0 -4px 12px hsla(var(--h) 38% 4%/.35);
            contain:strict;
        }
        .hub::after{
            content:'';position:absolute;inset:14px;border-radius:50%;
            background:radial-gradient(circle,var(--acc-xl),var(--acc));
            box-shadow:0 0 20px var(--glow);
            animation:hubP 3s ease-in-out infinite;
        }
        @keyframes hubP{0%,100%{box-shadow:0 0 20px var(--glow)}50%{box-shadow:0 0 35px var(--glow),0 0 60px hsla(var(--h) 70% 60%/.2)}}

        /* BURST & RAYS — лёгкие */
        .burst{
            position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:0;height:0;border-radius:50%;
            background:radial-gradient(circle,hsla(var(--h) 70% 68%/.2),transparent 70%);
            pointer-events:none;z-index:4;
            transition:width 1.2s cubic-bezier(.1,.8,.1,1),height 1.2s cubic-bezier(.1,.8,.1,1);
            contain:strict;
        }
        .burst.on{width:700px;height:700px}

        .rays{
            position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:500px;height:500px;z-index:4;pointer-events:none;
            opacity:0;transition:opacity 1s ease;contain:strict;
        }
        .rays.on{opacity:1;animation:raysRot 25s linear infinite}
        @keyframes raysRot{to{transform:translate(-50%,-50%) rotate(360deg)}}
        .ray{
            position:absolute;top:50%;left:50%;width:2px;height:240px;
            transform-origin:top center;
            background:linear-gradient(180deg,hsla(var(--h) 68% 78%/.25),transparent 50%);
            border-radius:1px;
        }

        /* ЭНЕРГО-КОЛЬЦО */
        .energy-ring{
            position:absolute;inset:-16px;border-radius:50%;
            border:2px solid transparent;pointer-events:none;z-index:2;
            opacity:0;transition:opacity .4s;contain:strict;
        }
        .energy-ring.on{opacity:1;animation:eP 1.5s ease-out infinite}
        @keyframes eP{0%{transform:scale(1);border-color:hsla(var(--h) 70% 70%/.4)}100%{transform:scale(1.25);border-color:transparent}}

        /* ====== КНОПКА ====== */
        .btn{
            position:relative;padding:18px 60px;
            font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;
            letter-spacing:5px;text-transform:uppercase;color:var(--txt);
            cursor:pointer;z-index:1;
            background:linear-gradient(135deg,hsla(var(--h) 44% 28%/.5),hsla(var(--h) 38% 16%/.6));
            border:1px solid var(--glass-b);border-radius:60px;
            box-shadow:0 10px 35px hsla(var(--h) 48% 14%/.25),inset 0 1px 0 hsla(0 0% 100%/.08);
            transition:all .3s ease;overflow:hidden;margin-top:40px;
            -webkit-tap-highlight-color:transparent;
        }
        .btn::after{
            content:'';position:absolute;top:0;left:-120%;width:70%;height:100%;
            background:linear-gradient(90deg,transparent,hsla(0 0% 100%/.05),transparent);
            transition:left .5s ease;
        }
        .btn:hover:not(:disabled)::after{left:130%}
        .btn:active:not(:disabled){transform:scale(.97);transition-duration:.1s}
        .btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

        /* ====== СЧЁТЧИК ====== */
        .counter{
            position:fixed;top:16px;right:18px;z-index:50;
            display:flex;align-items:center;gap:8px;
            font-size:11px;font-weight:600;color:var(--txt-m);letter-spacing:2px;
        }
        .counter-val{
            color:var(--acc-l);font-weight:800;font-size:15px;
            min-width:26px;text-align:center;
            background:hsla(var(--h) 45% 30%/.25);
            padding:5px 12px;border-radius:22px;
            border:1px solid hsla(var(--h) 50% 55%/.1);
        }

        /* ====== ТЕМЫ ====== */
        .theme-selector{
            position:fixed;top:16px;left:18px;z-index:50;
            display:flex;gap:7px;
        }
        .theme-btn{
            width:30px;height:30px;border-radius:50%;
            border:2px solid var(--glass-b);cursor:pointer;
            transition:all .3s;position:relative;overflow:hidden;
            -webkit-tap-highlight-color:transparent;
        }
        .theme-btn.active{border-color:var(--acc-l);box-shadow:0 0 12px var(--glow)}
        .theme-btn::before{content:'';position:absolute;inset:3px;border-radius:50%}
        .theme-btn[data-theme="default"]::before{background:linear-gradient(135deg,hsl(218 58% 54%),hsl(218 48% 35%))}
        .theme-btn[data-theme="ocean"]::before{background:linear-gradient(135deg,hsl(200 58% 54%),hsl(180 48% 35%))}
        .theme-btn[data-theme="sunset"]::before{background:linear-gradient(135deg,hsl(25 58% 54%),hsl(340 48% 35%))}
        .theme-btn[data-theme="forest"]::before{background:linear-gradient(135deg,hsl(140 58% 54%),hsl(100 48% 35%))}
        .theme-btn[data-theme="royal"]::before{background:linear-gradient(135deg,hsl(270 58% 54%),hsl(320 48% 35%))}
        .theme-btn[data-theme="cyber"]::before{background:linear-gradient(135deg,hsl(320 58% 54%),hsl(180 48% 35%))}

        /* ====== МОДАЛКА ====== */
        .m-ov{
            position:fixed;inset:0;z-index:200;
            display:flex;align-items:center;justify-content:center;
            background:hsla(var(--h) 42% 6%/.85);
            opacity:0;pointer-events:none;
            transition:opacity .4s ease;
        }
        .m-ov.open{opacity:1;pointer-events:all}

        .m-c{
            text-align:center;padding:48px 50px 42px;
            border-radius:28px;max-width:400px;width:88vw;
            position:relative;overflow:hidden;
            background:linear-gradient(165deg,hsla(var(--h) 38% 20%/.85),hsla(var(--h) 34% 8%/.92));
            border:1px solid hsla(var(--h) 48% 58%/.18);
            box-shadow:0 30px 100px hsla(var(--h) 38% 5%/.5),0 0 60px hsla(var(--h) 50% 40%/.08),inset 0 1px 0 hsla(0 0% 100%/.08);
            transform:scale(.8) translateY(40px);
            transition:transform .5s cubic-bezier(.175,.885,.32,1.275);
        }
        .m-ov.open .m-c{transform:scale(1) translateY(0)}

        .m-tag{
            display:inline-block;font-size:10px;font-weight:700;
            letter-spacing:5px;text-transform:uppercase;color:var(--acc);
            padding:8px 22px;border:1px solid hsla(var(--h) 48% 55%/.2);
            border-radius:50px;margin-bottom:28px;
            background:hsla(var(--h) 48% 48%/.08);
        }
        .m-tag.r{
            color:var(--rare-gold);border-color:hsla(45 80% 55%/.3);
            background:hsla(45 80% 50%/.1);box-shadow:0 0 20px hsla(45 80% 55%/.15);
        }

        .m-val{
            font-size:clamp(24px,7vw,38px);font-weight:900;
            line-height:1.2;margin-bottom:12px;letter-spacing:2px;
        }
        .m-val.rv{
            background:linear-gradient(135deg,var(--rare-gold),#fff,var(--rare-gold));
            background-size:200% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            animation:mShine 3s linear infinite;
        }
        @keyframes mShine{0%{background-position:200% center}100%{background-position:-200% center}}
        .m-val.cv{color:var(--acc)}

        .m-badge{
            display:inline-flex;align-items:center;gap:4px;
            padding:6px 14px;border-radius:20px;
            font-size:11px;font-weight:700;letter-spacing:1px;
            margin-bottom:12px;
        }
        .m-badge.common{background:hsla(var(--h) 40% 30%/.3);color:var(--txt-m);border:1px solid hsla(var(--h) 40% 50%/.2)}
        .m-badge.rare{background:hsla(45 80% 50%/.15);color:var(--rare-gold);border:1px solid hsla(45 80% 55%/.25)}
        .m-badge.epic{background:hsla(280 70% 50%/.15);color:hsl(280 80% 75%);border:1px solid hsla(280 70% 60%/.25)}

        .m-sub{font-size:13px;font-weight:400;color:var(--txt-m);margin-bottom:36px}

        .m-btn{
            padding:15px 50px;font-family:'Montserrat',sans-serif;
            font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;
            color:var(--acc-l);
            background:hsla(var(--h) 42% 32%/.25);
            border:1px solid hsla(var(--h) 48% 55%/.18);
            border-radius:55px;cursor:pointer;
            transition:all .3s ease;
            -webkit-tap-highlight-color:transparent;
        }
        .m-btn:active{transform:scale(.97)}

        /* ====== FX — конфетти канвас ====== */
        .fx-canvas{
            position:fixed;inset:0;z-index:199;
            pointer-events:none;
        }
        .screen-flash{
            position:fixed;inset:0;z-index:198;pointer-events:none;
            background:radial-gradient(circle at center,hsla(var(--h) 70% 80%/.1),transparent 70%);
            opacity:0;contain:strict;
        }
        .screen-flash.gold{background:radial-gradient(circle at center,hsla(45 90% 70%/.15),transparent 70%)}

        /* ====== PARTICLE CANVAS ====== */
        .particle-canvas{
            position:fixed;inset:0;z-index:1;
            pointer-events:none;
        }

        /* ====== RESPONSIVE ====== */
        @media(max-width:480px){
            .main{padding-top:8px;padding-bottom:20px}
            .hdr{margin-bottom:8px}
            .hdr h1{font-size:clamp(18px,5vw,26px);letter-spacing:3px}
            .hdr .sub{font-size:8px;letter-spacing:5px}
            .wh-wrap{--wh:min(300px,76vw)}
            .btn{padding:16px 40px;font-size:11px;letter-spacing:4px;margin-top:28px}
            .counter{top:8px;right:10px;font-size:9px}
            .ring{inset:-22px}.leds{inset:-22px}
            .hub{width:64px;height:64px}.hub::after{inset:11px}
            .ptr{top:-32px}.ptr-body{width:30px;height:42px}
            .theme-selector{left:10px;top:8px}.theme-btn{width:26px;height:26px}
            .m-c{padding:36px 24px 30px}
        }
        @media(max-width:360px){
            .wh-wrap{--wh:min(260px,80vw)}
            .btn{padding:14px 32px;font-size:10px;letter-spacing:3px}
            .hdr h1{font-size:18px}
        }
        @media(min-width:481px) and (max-width:768px){
            .wh-wrap{--wh:min(360px,70vw)}
        }
        @media(min-width:1200px){
            .wh-wrap{--wh:460px}
            .hdr h1{font-size:40px}
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="noise"></div>
<div class="stars" id="stars"></div>
<canvas class="particle-canvas" id="particleCv"></canvas>

<div class="theme-selector" id="themeSel">
    <div class="theme-btn active" data-theme="default"></div>
    <div class="theme-btn" data-theme="ocean"></div>
    <div class="theme-btn" data-theme="sunset"></div>
    <div class="theme-btn" data-theme="forest"></div>
    <div class="theme-btn" data-theme="royal"></div>
    <div class="theme-btn" data-theme="cyber"></div>
</div>

<div class="counter">
    <span>Осталось</span>
    <span class="counter-val" id="spinsLeft">1</span>
</div>

<div class="main">
    <div class="hdr">
        <h1>Колесо Фортуны</h1>
        <p class="sub">Испытай свою удачу</p>
    </div>

    <div class="wh-wrap" id="whWrap">
        <div class="ring" id="ring"></div>
        <div class="leds" id="leds"></div>
        <div class="energy-ring" id="energyRing"></div>

        <div class="ptr" id="ptr">
            <div class="ptr-body">
                <div class="ptr-shape"></div>
            </div>
            <div class="ptr-glow"></div>
        </div>

        <div class="rotor" id="rotor">
            <canvas class="cv" id="cv"></canvas>
        </div>
        <div class="in-sh"></div>
        <div class="gloss"></div>
        <div class="burst" id="burst"></div>
        <div class="rays" id="rays"></div>
        <div class="hub"></div>
    </div>

    <button class="btn" id="btnSpin">Крутить</button>
</div>

<div class="m-ov" id="mOv">
    <div class="m-c">
        <div class="m-tag" id="mTag">🎁 Ваш приз</div>
        <div class="m-val" id="mVal">Приз</div>
        <div class="m-badge" id="mBadge"></div>
        <div class="m-sub" id="mSub">Описание</div>
        <button class="m-btn" id="mBtn">Забрать</button>
    </div>
</div>

<canvas class="fx-canvas" id="fxCv"></canvas>
<div class="screen-flash" id="flash"></div>

<script>
/* =====================================================
   КОНФИГУРАЦИЯ
   ===================================================== */
const PRIZES = [
    {id:"10d",       label:"10 D",             w:35, desc:"Небольшой бонус",               d:10,  rarity:"common"},
    {id:"25d",       label:"25 D",             w:28, desc:"Приятный подарок",              d:25,  rarity:"common"},
    {id:"50d",       label:"50 D",             w:20, desc:"Хороший выигрыш",               d:50,  rarity:"common"},
    {id:"250d",      label:"250 D",            w:10, desc:"Отличный приз!",               d:250, rarity:"rare"},
    {id:"premium_1d",label:"+1 день Premium",  w:6,  desc:"Пробный доступ — 120 D",       d:120, rarity:"rare"},

function initCv() {
    const b = cv.parentElement.getBoundingClientRect();
    S = Math.round(b.width);
    const d = Math.min(devicePixelRatio || 1, 2);
    cv.width = S * d; cv.height = S * d;
    cv.style.width = S + 'px'; cv.style.height = S + 'px';
    c.setTransform(d, 0, 0, d, 0, 0);
    drawWheel();

function segColor(i, rarity) {
    if (rarity === 'epic') {
        const v = i % 2;
        return {
            g1:`hsla(45 ${80+v*10}% ${90+v*5}%/.95)`,
            g2:`hsla(50 ${75+v*10}% ${80+v*5}%/.9)`,
            t:`hsl(280 60% 15%)`,
            border:`hsla(45 90% 70%/1)`
        };
    }
    if (rarity === 'rare') {
        const v = i % 2;
        return {
            g1:`hsla(${H} ${55+v*15}% ${90+v*3}%/.92)`,
            g2:`hsla(${H} ${50+v*10}% ${80+v*4}%/.88)`,
            t:`hsl(${H} 60% 12%)`,
            border:`hsla(${H} 50% 85%/.9)`
        };
    }
    const v = [{l:14,s:45,a:.75},{l:18,s:42,a:.68},{l:12,s:48,a:.8},{l:16,s:44,a:.72}][i % 4];
    return {
        g1:`hsla(${H} ${v.s}% ${v.l}%/${v.a})`,
        g2:`hsla(${H} ${v.s+5}% ${v.l-3}%/${v.a+.05})`,
        t:`hsl(${H} 55% 75%)`,
        border:null
    };
}

function drawWheel() {
    const cx = S/2, cy = S/2, R = S/2;
    c.clearRect(0, 0, S, S);

    for (let i = 0; i < N; i++) {
        const p = PRIZES[i];
        const a0 = i * ARC - Math.PI/2;
        const a1 = a0 + ARC;
        const mid = a0 + ARC/2;
        const cl = segColor(i, p.rarity);

        // Сегмент
        const g = c.createRadialGradient(cx, cy, R*.15, cx + R*.5*Math.cos(mid), cy + R*.5*Math.sin(mid), R);
        g.addColorStop(0, cl.g2);
        g.addColorStop(.7, cl.g1);
        g.addColorStop(1, cl.g1);

        c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R-2, a0, a1); c.closePath();
        c.fillStyle = g; c.fill();

        // Рамка для редких
        if (cl.border) {
            c.beginPath(); c.arc(cx, cy, R-5, a0+.02, a1-.02);
            c.strokeStyle = cl.border;
            c.lineWidth = p.rarity === 'epic' ? 3 : 2;
            c.stroke();
        }

        // Разделитель
        c.beginPath();
        c.moveTo(cx + R*.2*Math.cos(a0), cy + R*.2*Math.sin(a0));
        c.lineTo(cx + (R-3)*Math.cos(a0), cy + (R-3)*Math.sin(a0));
        c.strokeStyle = `hsla(${H} 48% 58%/.1)`;
        c.lineWidth = 1; c.stroke();

        // Текст
        c.save(); c.translate(cx, cy); c.rotate(mid);
        const label = p.label;
        const parts = label.split(' ');
        const isMulti = parts.length > 1 && label.length > 5;
        const fs = Math.round(S * (isMulti ? .022 : label.length > 6 ? .027 : .03));
        c.font = `${p.rarity === 'epic' ? 900 : p.rarity === 'rare' ? 800 : 700} ${fs}px Montserrat,sans-serif`;
        c.fillStyle = cl.t;
        c.textAlign = 'center'; c.textBaseline = 'middle';

        const tr = R * .6;
        c.save(); c.translate(tr, 0);
        if (isMulti) {
            const lh = fs * 1.2;
            const lines = parts.length === 2 ? parts : [parts[0], parts.slice(1).join(' ')];
            const sy = -(lines.length - 1) * lh / 2;
            lines.forEach((ln, li) => c.fillText(ln, 0, sy + li * lh));
        } else {
            c.fillText(label, 0, 0);
        }
        c.restore(); c.restore();
    }

    // Внешняя рамка
    c.beginPath(); c.arc(cx, cy, cx - 2, 0, Math.PI*2);
    c.strokeStyle = `hsla(${H} 48% 60%/.08)`;
    c.lineWidth = 2; c.stroke();
}

function initLEDs() {
    ledsEl.innerHTML = '';
    ledA = [];
    const NL = PERF.leds;
    const frag = document.createDocumentFragment();
    const rr = ledsEl.offsetWidth / 2 || 230;

    for (let i = 0; i < NL; i++) {
        const a = (i / NL) * 360;
        const d = document.createElement('div');
        d.className = 'led';
        const rad = (a - 90) * Math.PI / 180;
        d.style.transform = `translate(${(rr-13)*Math.cos(rad)-2.5}px,${(rr-13)*Math.sin(rad)-2.5}px)`;
        frag.appendChild(d);
        ledA.push(d);
    }
    ledsEl.appendChild(frag);
}

let ledSpeed = 35, ledRunning = false, ledLastT = 0;

function ledsGo(speed) {
    ledSpeed = speed;
    if (ledRunning) return;
    ledRunning = true;
    ledLastT = 0;

    const NL = ledA.length;
    // Кэш предыдущих состояний для минимизации DOM операций
    const states = new Int8Array(NL); // 0=off, 1=on, 2=dim

    function loop(now) {
        if (!ledRunning) return;
        if (!ledLastT) ledLastT = now;
        if (now - ledLastT >= ledSpeed) {
            ledLastT = now;
            for (let i = 0; i < NL; i++) {
                const rel = ((i - ledIdx % NL) + NL) % NL;
                let newState = 0;
                if (rel < 2) newState = 1;
                else if (rel < 4) newState = 2;

                if (states[i] !== newState) {
                    states[i] = newState;
                    const el = ledA[i];
                    if (newState === 1)      { el.classList.add('on'); el.classList.remove('dim'); }
                    else if (newState === 2)  { el.classList.remove('on'); el.classList.add('dim'); }
                    else                      { el.classList.remove('on', 'dim'); }
                }
            }
            ledIdx += 2;
        }
        ledAnimId = requestAnimationFrame(loop);
    }
    ledAnimId = requestAnimationFrame(loop);
}

function ledsStop() {
    ledRunning = false;
    cancelAnimationFrame(ledAnimId);
    for (let i = 0; i < ledA.length; i++) ledA[i].classList.remove('on', 'dim');
}

function ledsHighlight(segIdx) {
    const NL = ledA.length;
    const start = Math.floor(segIdx * (NL / N));
    const count = Math.ceil(NL / N);
    for (let j = 0; j < count; j++) ledA[(start + j) % NL].classList.add('on');
}

/* =====================================================
   CONFETTI — на Canvas (0 DOM элементов!)
   ===================================================== */
let confettiParts = [];
let confettiRunning = false;

function fireConfetti(count, isGold = false) {
    const palette = isGold
        ? ['#FFD700','#FFC107','#FFE082','#FFF8E1','#FFFFFF']
        : [
            `hsl(${H},65%,75%)`,`hsl(${H},55%,60%)`,
            `hsl(${H},70%,85%)`,`hsl(${H},75%,92%)`,'#fff'
          ];

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 200 + Math.random() * 400;
        confettiParts.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel - 200,
            w: 2 + Math.random() * 6,
            h: 2 + Math.random() * 10,
            rot: Math.random() * 360,
            rotV: (Math.random() - .5) * 15,
            color: palette[Math.floor(Math.random() * palette.length)],
            life: 1,
            decay: .008 + Math.random() * .012,
            gravity: 300 + Math.random() * 200,
        });
    }

    if (!confettiRunning) {
        confettiRunning = true;
        let lastT = performance.now();
        function loop(now) {
            const dt = Math.min((now - lastT) / 1000, .05);
            lastT = now;
            fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            for (let i = confettiParts.length - 1; i >= 0; i--) {
                const p = confettiParts[i];
                p.vy += p.gravity * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= .99;
                p.rot += p.rotV;
                p.life -= p.decay;

                if (p.life <= 0) { confettiParts.splice(i, 1); continue; }

                fxCtx.save();
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate(p.rot * Math.PI / 180);
                fxCtx.globalAlpha = p.life;
                fxCtx.fillStyle = p.color;
                fxCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                fxCtx.restore();
            }

            if (confettiParts.length > 0) {
                requestAnimationFrame(loop);
            } else {
                confettiRunning = false;
                fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }
        }
        requestAnimationFrame(loop);
    }
}

/* =====================================================
   STARDUST PARTICLES — на Canvas
   ===================================================== */
let stardustParts = [];
let stardustRunning = false;

function addStardustBurst() {
    if (!PERF.particles) return;
    const rect = whWrap.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const r = rect.width / 2;

    for (let i = 0; i < 3; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = r * (.8 + Math.random() * .3);
        const flyAngle = angle + (Math.random() - .5) * .5;
        const flyDist = 40 + Math.random() * 100;
        stardustParts.push({
            x: cx + Math.cos(angle) * radius,
            y: cy + Math.sin(angle) * radius,
            vx: Math.cos(flyAngle) * flyDist,
            vy: Math.sin(flyAngle) * flyDist,
            size: 1.5 + Math.random() * 3,
            life: 1,
            decay: .015 + Math.random() * .02,
        });
    }
}

function runStardustLoop() {
    if (stardustRunning) return;
    stardustRunning = true;
    let lastT = performance.now();

    function loop(now) {
        const dt = Math.min((now - lastT) / 1000, .05);
        lastT = now;
        pCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        for (let i = stardustParts.length - 1; i >= 0; i--) {
            const p = stardustParts[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= .95; p.vy *= .95;
            p.life -= p.decay;
            if (p.life <= 0) { stardustParts.splice(i, 1); continue; }

            pCtx.globalAlpha = p.life;
            pCtx.fillStyle = '#fff';
            pCtx.beginPath();
            pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            pCtx.fill();
        }

        if (stardustParts.length > 0) {
            requestAnimationFrame(loop);
        } else {
            stardustRunning = false;
            pCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
    }
    requestAnimationFrame(loop);
}

/* =====================================================
   AUDIO — минимальный, переиспользование
   ===================================================== */
let actx = null, masterGain = null;

function initAudio() {
    if (actx) return;
    try {
        actx = new (AudioContext || webkitAudioContext)();
        masterGain = actx.createGain();
        masterGain.gain.value = 0.4;
        masterGain.connect(actx.destination);
    } catch(e) {}
}

function tick(freq, vol, dur) {
    if (!actx) return;
    try {
        const t = actx.currentTime;
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(.001, t + dur);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + dur + .01);
        o.onended = () => { o.disconnect(); g.disconnect(); };
    } catch(e) {}
}

function playTick(speed) {
    tick(1200 + speed * 600, .012 + speed * .025, .025 + speed * .015);
}

function playWin(rarity) {
    const seqs = {
        common: [[523,.04,.1],[659,.04,.1],[784,.04,.1],[1047,.04,.15]],
        rare:   [[523,.05,.15],[659,.05,.15],[784,.05,.15],[880,.05,.15],[1047,.05,.2],[1319,.05,.2]],
        epic:   [[523,.06,.2],[659,.06,.2],[784,.06,.2],[880,.06,.2],[1047,.06,.2],[1175,.06,.2],[1319,.06,.25],[1568,.06,.25]],
    };
    (seqs[rarity] || seqs.common).forEach(([f,v,d], i) => setTimeout(() => tick(f,v,d), i * 90));
}

/* =====================================================
   EASING — кастомный с 3 фазами
   ===================================================== */
function spinEase(t) {
    // Быстрый старт, длинный замедленный финиш
    if (t < 0.15) {
        // Ускорение — cubic ease-in
        const p = t / 0.15;
        return 0.15 * (p * p * p);
    }
    // Замедление — мощный ease-out
    const p = (t - 0.15) / 0.85;
    return 0.15 + 0.85 * (1 - Math.pow(1 - p, 4.5));
}

/* =====================================================
   ВРАЩЕНИЕ
   ===================================================== */
function spinWheel(winIdx, e) {
    isSpinning = true;
    btnSp.disabled = true;

    ring.classList.add('glow');
    energyRing.classList.add('on');

    haptic('med');

    // Расчёт целевого угла
    const randomOffset = (.15 + Math.random() * .7) * SEG_DEG;
    const prizeAngle = winIdx * SEG_DEG + randomOffset;
    let targetStop = (360 - prizeAngle) % 360;
    if (targetStop < 0) targetStop += 360;

    const curNorm = ((currentAngle % 360) + 360) % 360;
    const fullRots = 5 + Math.floor(Math.random() * 3);
    let delta = targetStop - curNorm;
    if (delta < 0) delta += 360;
    delta += fullRots * 360;

    const targetAngle = currentAngle + delta;
    const startAngle = currentAngle;
    const startTime = performance.now();
    const duration = 5000 + Math.random() * 1500;

    let lastSeg = -1;
    let stardustTimer = 0;

    ledsGo(35);

    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = spinEase(progress);
        const speed = 1 - eased; // нормализованная скорость [1→0]

        currentAngle = startAngle + (targetAngle - startAngle) * eased;
        rotor.style.transform = `rotate(${currentAngle}deg)`;

        // LED скорость
        ledSpeed = Math.max(25, 100 * speed);

        // Stardust на canvas (не каждый кадр)
        stardustTimer += elapsed;
        if (PERF.particles && speed > 0.1 && progress < 0.95) {
            addStardustBurst();
            runStardustLoop();
        }

        // Тик при смене сегмента
        const normAngle = ((currentAngle % 360) + 360) % 360;
        const curSeg = Math.floor(normAngle / SEG_DEG);
        if (curSeg !== lastSeg) {
            lastSeg = curSeg;

            // Отскок указателя — чистый transform, без layout
            const bounce = (3 + Math.random() * 3) * Math.min(speed * 2, 1);
            ptr.style.transform = `translate3d(-50%,0,0) rotate(${bounce}deg)`;
            setTimeout(() => {
                ptr.style.transform = `translate3d(-50%,0,0) rotate(${-bounce*.3}deg)`;
                setTimeout(() => {
                    ptr.style.transform = `translate3d(-50%,0,0)`;
                }, 40);
            }, 25);

            playTick(speed);
            if (speed > 0.3) haptic('light');
        }

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            onSpinEnd(winIdx);
        }
    }

    requestAnimationFrame(animate);
}

/* =====================================================
   КОНЕЦ ВРАЩЕНИЯ
   ===================================================== */
function onSpinEnd(winIdx) {
    isSpinning = false;
    ledsStop();

    ring.classList.remove('glow');
    energyRing.classList.remove('on');

    // Подсветить выигравший сегмент
    ledsHighlight(winIdx);

    ptr.style.transform = 'translate3d(-50%,0,0)';

    const prize = PRIZES[winIdx];
    const isEpic = prize.rarity === 'epic';
    const isRare = prize.rarity === 'rare';

    // Эффекты победы
    if (isEpic) {
        flash.classList.add('gold');
        flash.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:500});
        burst.classList.add('on'); raysEl.classList.add('on');
        haptic('success');
        playWin('epic');
        fireConfetti(PERF.confetti * 2, true);
        setTimeout(() => fireConfetti(PERF.confetti), 200);
        if (navigator.vibrate) navigator.vibrate([100,50,200,50,300]);
    } else if (isRare) {
        flash.classList.add('gold');
        flash.animate([{opacity:0},{opacity:.7},{opacity:0}],{duration:400});
        burst.classList.add('on'); raysEl.classList.add('on');
        haptic('success');
        playWin('rare');
        fireConfetti(PERF.confetti * 1.5);
        fireConfetti(Math.floor(PERF.confetti * .8), true);
    } else {
        flash.animate([{opacity:0},{opacity:.3},{opacity:0}],{duration:250});
        haptic('med');
        playWin('common');
        fireConfetti(PERF.confetti);
    }

    setTimeout(() => showModal(prize), isEpic ? 600 : isRare ? 500 : 250);
    setTimeout(() => {
        tg.sendData(JSON.stringify({
            action: 'wheel_result',
            prize_id: prize.id,
            prize_index: winIdx,
        }));
    }, 100);
}

/* =====================================================
   КНОПКА
   ===================================================== */
async function onSpinClick(e) {
    if (isSpinning || !canSpin) return;
    canSpin = false;
    initAudio();

    const result = await requestSpin();
    if (!result) { canSpin = true; return; }

    spinWheel(result.prize_index, e);
}

btnSp.addEventListener('click', onSpinClick);

/* =====================================================
   МОДАЛКА
   ===================================================== */
const rarityMeta = {
    common: {tag:'🎁 Ваш приз', tc:'', label:'Обычный'},
    rare:   {tag:'💎 Редкий приз!', tc:'r', label:'Редкий'},
    epic:   {tag:'🏆 Эпический приз!', tc:'r', label:'Эпический'},
};

function showModal(prize) {
    const m = rarityMeta[prize.rarity] || rarityMeta.common;
    mTag.textContent = m.tag;
    mTag.className = 'm-tag' + (m.tc ? ' ' + m.tc : '');
    mVal.textContent = prize.label;
    mVal.className = 'm-val ' + (prize.rarity !== 'common' ? 'rv' : 'cv');
    mBadge.textContent = `${prize.d} D · ${m.label}`;
    mBadge.className = 'm-badge ' + prize.rarity;
    mSub.textContent = prize.desc;
    mOv.classList.add('open');
}

function closeModal() {
    mOv.classList.remove('open');
    burst.classList.remove('on');
    raysEl.classList.remove('on');
    flash.classList.remove('gold');
}

mBtn.addEventListener('click', closeModal);
mOv.addEventListener('click', e => { if (e.target === mOv) closeModal(); });

/* =====================================================
   INIT & RESIZE
   ===================================================== */
let resizeTimer;
function handleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if (!isSpinning) {
            const saved = currentAngle;
            resizeFxCanvas();
            initCv();
            initLEDs();
            rotor.style.transform = `rotate(${saved}deg)`;
        } else {
            resizeFxCanvas();
        }
    }, 200);
}

addEventListener('DOMContentLoaded', () => {
    resizeFxCanvas();
    initCv();
    initLEDs();
    checkCanSpin();
});

addEventListener('resize', handleResize, {passive: true});

// Предотвращаем проблемы с overscroll в TG
document.addEventListener('touchmove', e => {
    if (e.target.closest('.m-ov') || e.target.closest('.main')) {
        // Разрешаем скролл только если нужно
    }
}, {passive: true});
</script>
