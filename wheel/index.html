<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Фортуны</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

        :root{
            --h:218;--s:58%;
            --bg:hsl(var(--h) 42% 5%);
            --acc:hsl(var(--h) var(--s) 54%);
            --acc-l:hsl(var(--h) 68% 78%);
            --acc-xl:hsl(var(--h) 72% 90%);
            --glow:hsla(var(--h) 80% 60%/.45);
            --glass-b:hsla(var(--h) 45% 65%/.16);
            --txt:hsl(var(--h) 25% 92%);
            --txt-m:hsla(var(--h) 22% 72%/.5);
            --wh:min(420px,78vw);
            --rare-gold:hsl(45 80% 55%);
            --h2:260;
            --ring-shimmer:hsla(var(--h) 60% 70%/.04);
            --star-color:var(--acc-l);
            --led-glow:var(--glow);
        }

        [data-theme="cosmos"]{--h:218;--s:58%;--h2:260;--ring-shimmer:hsla(260 60% 70%/.05);--star-color:hsla(220 70% 85%/1);--led-glow:hsla(240 80% 65%/.4)}
        [data-theme="flame"]{--h:12;--s:72%;--h2:35;--ring-shimmer:hsla(35 80% 60%/.06);--star-color:hsla(35 90% 75%/1);--led-glow:hsla(20 90% 55%/.45);--rare-gold:hsl(50 85% 55%)}
        [data-theme="neon"]{--h:280;--s:65%;--h2:170;--ring-shimmer:hsla(170 80% 55%/.06);--star-color:hsla(280 80% 82%/1);--led-glow:hsla(280 80% 65%/.45)}

        html{-webkit-font-smoothing:antialiased}
        body{
            font-family:'Montserrat',sans-serif;
            min-height:100vh;min-height:100dvh;
            display:flex;align-items:center;justify-content:center;
            background:var(--bg);overflow:hidden;
            color:var(--txt);
            -webkit-tap-highlight-color:transparent;
            -webkit-user-select:none;user-select:none;
        }

        /* ====== ФОН ====== */
        .bg{position:fixed;inset:0;z-index:0;transition:background 1s ease;contain:strict}
        [data-theme="cosmos"] .bg,.bg{
            background:
                radial-gradient(ellipse 120% 80% at 20% 10%,hsla(260 50% 20%/.5),transparent),
                radial-gradient(ellipse 100% 90% at 80% 90%,hsla(218 40% 12%/.6),transparent),
                radial-gradient(circle at 50% 50%,hsla(230 30% 8%/.4),transparent 70%),
                linear-gradient(155deg,hsl(218 42% 5%),hsl(240 36% 4%));
        }
        [data-theme="flame"] .bg{
            background:
                radial-gradient(ellipse 120% 80% at 25% 15%,hsla(0 55% 16%/.6),transparent),
                radial-gradient(ellipse 90% 80% at 75% 85%,hsla(35 50% 12%/.5),transparent),
                radial-gradient(circle at 50% 70%,hsla(20 40% 8%/.3),transparent 60%),
                linear-gradient(165deg,hsl(5 28% 5%),hsl(20 22% 3%));
        }
        [data-theme="neon"] .bg{
            background:
                radial-gradient(ellipse 120% 80% at 15% 10%,hsla(280 45% 15%/.55),transparent),
                radial-gradient(ellipse 100% 90% at 85% 90%,hsla(170 40% 10%/.5),transparent),
                radial-gradient(circle at 60% 40%,hsla(300 30% 8%/.3),transparent 60%),
                linear-gradient(155deg,hsl(270 28% 4%),hsl(200 22% 3%));
        }

        .orb{position:fixed;border-radius:50%;filter:blur(100px);z-index:0;contain:strict;transition:background 1s ease}
        .o1{width:500px;height:500px;top:-16%;left:-10%;animation:oF1 26s ease-in-out infinite alternate}
        .o2{width:380px;height:380px;bottom:-12%;right:-6%;animation:oF2 20s ease-in-out infinite alternate-reverse}
        .o3{width:220px;height:220px;top:38%;left:58%;animation:oF3 30s ease-in-out infinite alternate}

        [data-theme="cosmos"] .o1,.o1{background:hsla(260 50% 25%/.18)}
        [data-theme="cosmos"] .o2,.o2{background:hsla(218 55% 20%/.14)}
        [data-theme="cosmos"] .o3,.o3{background:hsla(200 60% 30%/.07)}
        [data-theme="flame"] .o1{background:hsla(0 55% 25%/.2)}
        [data-theme="flame"] .o2{background:hsla(35 50% 22%/.16)}
        [data-theme="flame"] .o3{background:hsla(20 45% 28%/.1)}
        [data-theme="neon"] .o1{background:hsla(280 55% 22%/.18)}
        [data-theme="neon"] .o2{background:hsla(170 50% 18%/.14)}
        [data-theme="neon"] .o3{background:hsla(310 45% 25%/.08)}

        @keyframes oF1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(30px,-20px,0) scale(1.05)}}
        @keyframes oF2{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-22px,18px,0) scale(1.04)}}
        @keyframes oF3{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-12px,-16px,0) scale(1.08)}}

        .noise{position:fixed;inset:0;z-index:0;opacity:.02;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px;contain:strict}

        .stars{position:fixed;inset:0;z-index:0;pointer-events:none;contain:strict;overflow:hidden}
        .star{position:absolute;border-radius:50%;background:var(--star-color);opacity:0;animation:starP var(--dur) ease-in-out infinite;animation-delay:var(--del);contain:strict}
        @keyframes starP{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.7;transform:scale(1)}}
        [data-theme="cosmos"] .star{box-shadow:0 0 3px var(--star-color)}
        [data-theme="flame"] .star{background:var(--star-color);box-shadow:0 0 4px hsla(35 90% 60%/.5);width:3px!important;height:3px!important}
        [data-theme="neon"] .star:nth-child(odd){background:hsla(170 80% 65%/1);box-shadow:0 0 5px hsla(170 80% 55%/.4)}
        [data-theme="neon"] .star:nth-child(even){background:hsla(300 80% 70%/1);box-shadow:0 0 5px hsla(300 80% 60%/.4)}

        .grid-subtle{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.012;contain:strict;transition:opacity .5s,background-image .5s}
        [data-theme="cosmos"] .grid-subtle,.grid-subtle{background-image:linear-gradient(hsla(220 40% 50%/.3) 1px,transparent 1px),linear-gradient(90deg,hsla(220 40% 50%/.3) 1px,transparent 1px);background-size:80px 80px}
        [data-theme="flame"] .grid-subtle{opacity:.018;background-image:linear-gradient(hsla(20 50% 50%/.4) 1px,transparent 1px);background-size:100% 60px}
        [data-theme="neon"] .grid-subtle{opacity:.025;background-image:linear-gradient(hsla(280 40% 55%/.25) 1px,transparent 1px),linear-gradient(90deg,hsla(170 40% 50%/.25) 1px,transparent 1px);background-size:50px 50px}

        .theme-decor{position:fixed;pointer-events:none;z-index:0;contain:strict;transition:opacity 1s}
        .nebula{inset:0;opacity:0}
        [data-theme="cosmos"] .nebula{opacity:1;background:radial-gradient(ellipse 40% 30% at 70% 25%,hsla(260 60% 40%/.06),transparent),radial-gradient(ellipse 35% 40% at 25% 70%,hsla(200 50% 35%/.05),transparent)}
        .ember-glow{bottom:0;left:0;right:0;height:40%;opacity:0}
        [data-theme="flame"] .ember-glow{opacity:1;background:linear-gradient(to top,hsla(15 60% 12%/.3),hsla(25 50% 10%/.1) 40%,transparent)}
        .neon-horizon{bottom:18%;left:5%;right:5%;height:1px;opacity:0}
        [data-theme="neon"] .neon-horizon{opacity:1;background:linear-gradient(90deg,transparent,hsla(170 80% 55%/.2) 20%,hsla(280 70% 60%/.25) 50%,hsla(170 80% 55%/.2) 80%,transparent);box-shadow:0 0 15px hsla(170 80% 55%/.08),0 0 40px hsla(280 60% 55%/.05)}
        .neon-horizon-2{bottom:22%;left:10%;right:10%;height:1px;opacity:0}
        [data-theme="neon"] .neon-horizon-2{opacity:.5;background:linear-gradient(90deg,transparent,hsla(280 70% 60%/.15) 30%,hsla(170 70% 55%/.15) 70%,transparent)}

        .flame-embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:0;transition:opacity 1s;contain:strict}
        [data-theme="flame"] .flame-embers{opacity:1}
        .ember{position:absolute;border-radius:50%;background:hsla(30 90% 60%/.6);animation:emberRise var(--edur) ease-in infinite;animation-delay:var(--edel);opacity:0;contain:strict}
        @keyframes emberRise{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.6}85%{opacity:.4}100%{opacity:0;transform:translateY(calc(-100vh - 20px)) translateX(var(--edrift)) scale(.2)}}

        /* ====== LAYOUT ====== */
        .main{
            position:relative;z-index:1;
            display:flex;flex-direction:column;align-items:center;
            padding:10px 16px 16px;
            opacity:0;animation:mainIn .8s ease forwards .1s;
        }
        @keyframes mainIn{to{opacity:1}}

        /* ====== ЗАГОЛОВОК — СИЛЬНО ПОДНЯТ ====== */
        .hdr{
            text-align:center;
            margin-bottom:34px;
        }
        .hdr h1{
            font-size:clamp(17px,4.2vw,30px);font-weight:900;
            letter-spacing:3px;text-transform:uppercase;
            background:linear-gradient(100deg,hsla(var(--h) 35% 58%/.5),var(--txt) 25%,#fff 50%,var(--txt) 75%,hsla(var(--h) 35% 58%/.5));
            background-size:280% 100%;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            animation:tSh 8s linear infinite;
            line-height:1;
        }
        @keyframes tSh{0%{background-position:280% center}100%{background-position:-280% center}}
        .hdr .sub{
            font-size:7px;font-weight:600;color:var(--txt-m);
            letter-spacing:6px;text-transform:uppercase;margin-top:3px;
        }
        [data-theme="flame"] .hdr .sub{letter-spacing:5px;color:hsla(30 50% 65%/.5)}
        [data-theme="neon"] .hdr .sub{letter-spacing:7px;color:hsla(280 40% 70%/.4)}

        /* ====== ТАЙМЕР ====== */
        .timer-box{position:fixed;top:12px;right:12px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
        .timer-label{font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--txt-m);opacity:.6}
        .timer-val{color:var(--acc-l);font-weight:800;font-size:12px;background:hsla(var(--h) 45% 30%/.2);padding:4px 12px;border-radius:18px;border:1px solid hsla(var(--h) 50% 55%/.08);font-variant-numeric:tabular-nums;min-width:82px;text-align:center;transition:all .5s}
        .timer-val.ready{color:hsl(140 70% 65%);border-color:hsla(140 60% 50%/.15);background:hsla(140 50% 30%/.1);animation:readyPulse 2s ease-in-out infinite}
        @keyframes readyPulse{0%,100%{box-shadow:0 0 0 0 hsla(140 60% 50%/.05)}50%{box-shadow:0 0 12px 2px hsla(140 60% 50%/.1)}}

        /* ====== ТЕМЫ ====== */
        .theme-selector{position:fixed;top:12px;left:12px;z-index:50;display:flex;gap:7px}
        .theme-btn{width:32px;height:32px;border-radius:50%;border:2px solid hsla(var(--h) 40% 50%/.12);cursor:pointer;transition:all .4s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
        .theme-btn:active{transform:scale(.9)}
        .theme-btn.active{border-color:var(--acc-l);box-shadow:0 0 14px var(--glow),0 0 3px var(--glow);transform:scale(1.05)}
        .theme-btn::before{content:'';position:absolute;inset:3px;border-radius:50%}
        .theme-btn::after{content:'';position:absolute;inset:3px;border-radius:50%;background:linear-gradient(160deg,hsla(0 0% 100%/.2),transparent 50%)}
        .theme-btn[data-theme="cosmos"]::before{background:linear-gradient(135deg,hsl(260 50% 45%),hsl(218 55% 30%))}
        .theme-btn[data-theme="flame"]::before{background:linear-gradient(135deg,hsl(12 72% 45%),hsl(35 80% 40%))}
        .theme-btn[data-theme="neon"]::before{background:linear-gradient(135deg,hsl(280 60% 45%),hsl(170 70% 35%))}
        .theme-name{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:6px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-m);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
        .theme-btn.active .theme-name{opacity:.8}

        /* ====== КОЛЕСО ====== */
        .wh-wrap{position:relative;width:var(--wh);height:var(--wh);contain:layout size}

        .ring{position:absolute;inset:-26px;border-radius:50%;border:1px solid var(--glass-b);box-shadow:0 0 70px hsla(var(--h) 55% 28%/.1),inset 0 0 50px hsla(var(--h) 55% 28%/.04);transition:box-shadow .5s,border-color .5s;contain:strict}
        [data-theme="cosmos"] .ring,.ring{background:linear-gradient(135deg,hsla(260 35% 45%/.05),hsla(218 35% 35%/.02) 40%,hsla(200 40% 45%/.04))}
        [data-theme="flame"] .ring{background:linear-gradient(135deg,hsla(0 45% 35%/.07),hsla(35 35% 28%/.03) 40%,hsla(20 40% 35%/.05))}
        [data-theme="neon"] .ring{background:linear-gradient(135deg,hsla(280 45% 40%/.06),hsla(170 35% 35%/.03) 40%,hsla(200 40% 40%/.05))}
        .ring.glow{box-shadow:0 0 100px hsla(var(--h) 55% 28%/.18),0 0 50px hsla(var(--h) 55% 35%/.1),inset 0 0 70px hsla(var(--h) 55% 28%/.05);border-color:hsla(var(--h) 50% 60%/.2)}
        .ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,var(--ring-shimmer) 8%,transparent 16%);animation:ringShimmer 10s linear infinite}
        @keyframes ringShimmer{to{transform:rotate(360deg)}}
        [data-theme="flame"] .ring::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 180deg,transparent 0%,hsla(0 60% 50%/.04) 5%,transparent 10%);animation:ringShimmer 14s linear infinite reverse}
        [data-theme="neon"] .ring::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 120deg,transparent 0%,hsla(170 70% 55%/.05) 6%,transparent 12%);animation:ringShimmer 12s linear infinite reverse}

        .leds{position:absolute;inset:-26px;border-radius:50%;pointer-events:none;contain:strict}
        .led{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--acc-l);opacity:.06;top:50%;left:50%;contain:strict}
        .led.on{opacity:1;box-shadow:0 0 8px var(--led-glow),0 0 18px hsla(var(--h) 70% 60%/.12);transform:scale(1.3)}
        .led.dim{opacity:.3;transform:scale(1.1)}
        [data-theme="flame"] .led{background:hsla(35 80% 65%/1)}
        [data-theme="flame"] .led.on{box-shadow:0 0 8px hsla(25 90% 55%/.5),0 0 18px hsla(15 80% 50%/.15)}
        [data-theme="neon"] .led:nth-child(odd){background:hsla(170 80% 65%/1)}
        [data-theme="neon"] .led:nth-child(even){background:hsla(300 70% 70%/1)}
        [data-theme="neon"] .led.on:nth-child(odd){box-shadow:0 0 8px hsla(170 80% 55%/.5),0 0 18px hsla(170 70% 50%/.15)}
        [data-theme="neon"] .led.on:nth-child(even){box-shadow:0 0 8px hsla(300 80% 60%/.5),0 0 18px hsla(300 70% 55%/.15)}

        .rotor{position:absolute;inset:0;border-radius:50%;will-change:transform;transform:translate3d(0,0,0) rotate(0deg);contain:layout size}
        .cv{width:100%;height:100%;border-radius:50%;display:block}

        .in-sh{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 45px hsla(var(--h) 42% 4%/.3),inset 0 -5px 22px hsla(var(--h) 42% 4%/.18);pointer-events:none;z-index:3;contain:strict}
        .gloss{position:absolute;inset:0;border-radius:50%;background:linear-gradient(165deg,hsla(var(--h) 60% 90%/.05) 0%,transparent 32%);pointer-events:none;z-index:3;contain:strict}

        .ptr{position:absolute;top:-34px;left:50%;transform:translate3d(-50%,0,0);z-index:20;filter:drop-shadow(0 4px 18px var(--glow));will-change:transform;contain:layout}
        .ptr-body{width:32px;height:44px;position:relative}
        .ptr-shape{width:100%;height:100%;clip-path:polygon(50% 100%,5% 0,95% 0);background:linear-gradient(180deg,var(--acc-l) 0%,var(--acc) 60%,hsla(var(--h) 52% 40%/.85) 100%)}
        .ptr-shape::before{content:'';position:absolute;inset:3px;clip-path:polygon(50% 100%,5% 0,95% 0);background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 50%)}
        .ptr-glow{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--glow);filter:blur(7px);animation:pG 2.5s ease-in-out infinite}
        @keyframes pG{0%,100%{opacity:.2;transform:translateX(-50%) scale(1)}50%{opacity:.7;transform:translateX(-50%) scale(1.7)}}

        .hub{position:absolute;top:50%;left:50%;transform:translate3d(-50%,-50%,0);width:74px;height:74px;border-radius:50%;z-index:10;background:linear-gradient(145deg,hsla(var(--h) 38% 20%/.92),hsla(var(--h) 34% 8%/.96));border:1px solid hsla(var(--h) 50% 58%/.15);box-shadow:0 0 30px hsla(var(--h) 48% 22%/.18),inset 0 1px 0 hsla(0 0% 100%/.06),inset 0 -3px 8px hsla(var(--h) 38% 4%/.25);contain:strict}
        .hub::before{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid hsla(var(--h) 50% 58%/.05);background:radial-gradient(circle at 30% 30%,hsla(var(--h) 58% 68%/.05),transparent 55%)}
        .hub::after{content:'';position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle,var(--acc-xl),var(--acc));box-shadow:0 0 15px var(--glow);animation:hubP 3s ease-in-out infinite}
        @keyframes hubP{0%,100%{box-shadow:0 0 15px var(--glow)}50%{box-shadow:0 0 28px var(--glow),0 0 45px hsla(var(--h) 70% 60%/.12)}}
        .hub-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;font-size:20px;animation:hubSpin 18s linear infinite;filter:drop-shadow(0 0 5px hsla(var(--h) 60% 80%/.3))}
        @keyframes hubSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
        [data-theme="flame"] .hub-icon{filter:drop-shadow(0 0 5px hsla(30 80% 60%/.4))}
        [data-theme="neon"] .hub-icon{filter:drop-shadow(0 0 6px hsla(280 70% 70%/.4))}

        .burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-radius:50%;background:radial-gradient(circle,hsla(var(--h) 70% 68%/.16),transparent 70%);pointer-events:none;z-index:4;transition:width 1.2s cubic-bezier(.1,.8,.1,1),height 1.2s cubic-bezier(.1,.8,.1,1);contain:strict}
        .burst.on{width:600px;height:600px}

        .rays{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:450px;height:450px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1s ease;contain:strict}
        .rays.on{opacity:1;animation:raysRot 25s linear infinite}
        @keyframes raysRot{to{transform:translate(-50%,-50%) rotate(360deg)}}
        .ray{position:absolute;top:50%;left:50%;width:2px;height:220px;transform-origin:top center;background:linear-gradient(180deg,hsla(var(--h) 68% 78%/.2),transparent 50%);border-radius:1px}

        .energy-ring{position:absolute;inset:-14px;border-radius:50%;border:2px solid transparent;pointer-events:none;z-index:2;opacity:0;transition:opacity .4s;contain:strict}
        .energy-ring.on{opacity:1;animation:eP 1.4s ease-out infinite}
        @keyframes eP{0%{transform:scale(1);border-color:hsla(var(--h) 70% 70%/.3)}100%{transform:scale(1.2);border-color:transparent}}

        /* ====== КНОПКА ====== */
        .btn{position:relative;padding:16px 52px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--txt);cursor:pointer;z-index:1;background:linear-gradient(135deg,hsla(var(--h) 44% 28%/.45),hsla(var(--h) 38% 16%/.55));border:1px solid var(--glass-b);border-radius:60px;box-shadow:0 8px 28px hsla(var(--h) 48% 14%/.18),inset 0 1px 0 hsla(0 0% 100%/.05);transition:all .3s ease;overflow:hidden;margin-top:32px;-webkit-tap-highlight-color:transparent}
        .btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,hsla(0 0% 100%/.04),transparent);animation:btnShine 4s ease-in-out infinite}
        @keyframes btnShine{0%,100%{left:-100%}50%{left:150%}}
        .btn:active:not(:disabled){transform:scale(.96);transition-duration:.1s}
        .btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
        .btn.waiting{font-size:9px;letter-spacing:3px;padding:14px 28px}

        /* ====== МОДАЛКА ====== */
        .m-ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:hsla(var(--h) 42% 4%/.88);opacity:0;pointer-events:none;transition:opacity .4s ease}
        .m-ov.open{opacity:1;pointer-events:all}

const N=PRIZES.length,ARC=Math.PI*2/N,SEG_DEG=360/N;

const $=id=>document.getElementById(id);

/* AMBIENT HUM */
let ambCtx=null,ambOsc=null,ambGain=null,ambLfo=null,ambLfoGain=null;
const AMB_BASE=.018,AMB_SPIN=.06;

function initAmbient(){
    if(ambCtx)return;

        ambCtx=new(AudioContext||webkitAudioContext)();
        ambOsc=ambCtx.createOscillator();ambOsc.type='sine';ambOsc.frequency.value=80;
        ambGain=ambCtx.createGain();ambGain.gain.value=AMB_BASE;
        ambLfo=ambCtx.createOscillator();ambLfo.type='sine';ambLfo.frequency.value=.3;
        ambLfoGain=ambCtx.createGain();ambLfoGain.gain.value=.005;
        ambLfo.connect(ambLfoGain);ambLfoGain.connect(ambGain.gain);
        ambOsc.connect(ambGain);ambGain.connect(ambCtx.destination);
        ambOsc.start();ambLfo.start();

}

function setAmbientIntensity(l){
    if(!ambGain)return;

    ambGain.gain.setTargetAtTime(AMB_BASE+l*(AMB_SPIN-AMB_BASE),t,.1);
    if(ambOsc)ambOsc.frequency.setTargetAtTime(80+l*40,t,.1);
    if(ambLfo){ambLfo.frequency.setTargetAtTime(.3+l*2,t,.1);ambLfoGain.gain.setTargetAtTime(.005+l*.015,t,.1)}
}

function setAmbientTheme(theme){
    if(!ambOsc)return;
    const f={cosmos:80,flame:65,neon:95};
    ambOsc.frequency.setTargetAtTime(f[theme]||80,ambCtx.currentTime,.3);
}

/* TICK AUDIO */
let actx=null,masterGain=null;

function tick(freq,vol,dur){
    if(!actx)return;
    try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.01);o.onended=()=>{o.disconnect();g.disconnect()}}catch(e){}
}

function playTick(speed){
    const th={cosmos:{b:1200,r:600},flame:{b:800,r:400},neon:{b:1500,r:800}};
    const t=th[currentThemeName]||th.cosmos;
    tick(t.b+speed*t.r,.01+speed*.018,.02+speed*.01);
}

function playWin(rarity){
    const s={common:[[523,.03,.1],[659,.03,.1],[784,.03,.1],[1047,.03,.12]],rare:[[523,.04,.14],[659,.04,.14],[784,.04,.14],[880,.04,.14],[1047,.04,.18],[1319,.04,.18]],epic:[[523,.05,.18],[659,.05,.18],[784,.05,.18],[880,.05,.18],[1047,.05,.18],[1175,.05,.2],[1319,.05,.22],[1568,.05,.25]]};
    (s[rarity]||s.common).forEach(([f,v,d],i)=>setTimeout(()=>tick(f,v,d),i*85));
}

/* TIMER */
function startCountdown(ts){nextSpinTime=ts;clearInterval(timerInterval);updateTimer();timerInterval=setInterval(updateTimer,1000)}
function updateTimer(){
    if(!nextSpinTime)return;const diff=nextSpinTime-Date.now();
    if(diff<=0){clearInterval(timerInterval);timerLabel.textContent='Готово!';timerVal.textContent='🎰 Спин';timerVal.classList.add('ready');canSpin=true;btnSp.disabled=false;btnSp.textContent='Крутить';btnSp.classList.remove('waiting');return}
    const h=Math.floor(diff/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1e3);
    timerLabel.textContent='Следующий спин';timerVal.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;timerVal.classList.remove('ready');
}
function showSpinReady(){timerLabel.textContent='Доступно';timerVal.textContent='1 спин';timerVal.classList.add('ready')}
function showSpinUsed(){btnSp.disabled=true;btnSp.textContent='Следующий спин скоро';btnSp.classList.add('waiting');canSpin=false}

/* CANVAS SIZE */
function resizeFx(){
    dpr=Math.min(devicePixelRatio||1,2);const w=innerWidth,h=innerHeight;
    fxCv.width=w*dpr;fxCv.height=h*dpr;fxCv.style.width=w+'px';fxCv.style.height=h+'px';fxCtx.setTransform(dpr,0,0,dpr,0,0);
    particleCv.width=w*dpr;particleCv.height=h*dpr;particleCv.style.width=w+'px';particleCv.style.height=h+'px';pCtx.setTransform(dpr,0,0,dpr,0,0);
}

/* WHEEL CANVAS — УВЕЛИЧЕННЫЙ ТЕКСТ */
const themeWC={
    cosmos:{seg:[{l:14,s:50,a:.78},{l:20,s:44,a:.68},{l:12,s:55,a:.82},{l:17,s:48,a:.74}],rare:{s1:60,l1:90,s2:55,l2:82}},
    flame:{seg:[{l:18,s:58,a:.78},{l:22,s:52,a:.68},{l:15,s:62,a:.82},{l:20,s:55,a:.74}],rare:{s1:68,l1:88,s2:62,l2:80}},
    neon:{seg:[{l:12,s:52,a:.78},{l:17,s:46,a:.68},{l:10,s:58,a:.82},{l:15,s:50,a:.74}],rare:{s1:60,l1:92,s2:55,l2:85}},
};

function segColor(i,rarity){
    if(rarity==='epic'){const v=i%2;return{g1:`hsla(45 ${80+v*10}% ${90+v*5}%/.95)`,g2:`hsla(50 ${75+v*10}% ${80+v*5}%/.9)`,t:'hsl(280 60% 15%)',border:'hsla(45 90% 70%/1)'}}
    const tc=themeWC[currentThemeName]||themeWC.cosmos;
    if(rarity==='rare'){const v=i%2;return{g1:`hsla(${H} ${tc.rare.s1+v*12}% ${tc.rare.l1+v*3}%/.92)`,g2:`hsla(${H} ${tc.rare.s2+v*8}% ${tc.rare.l2+v*4}%/.88)`,t:`hsl(${H} 60% 12%)`,border:`hsla(${H} 50% 85%/.9)`}}
    const v=tc.seg[i%4];
    return{g1:`hsla(${H} ${v.s}% ${v.l}%/${v.a})`,g2:`hsla(${H} ${v.s+5}% ${v.l-3}%/${v.a+.05})`,t:`hsl(${H} 55% 75%)`,border:null};
}

function initCv(){
    const b=cv.parentElement.getBoundingClientRect();S=Math.round(b.width);
    const d=Math.min(devicePixelRatio||1,2);
    cv.width=S*d;cv.height=S*d;cv.style.width=S+'px';cv.style.height=S+'px';
    c.setTransform(d,0,0,d,0,0);drawWheel();
}

function drawWheel(){
    const cx=S/2,cy=S/2,R=S/2;
    c.clearRect(0,0,S,S);

    for(let i=0;i<N;i++){
        const p=PRIZES[i],a0=i*ARC-Math.PI/2,a1=a0+ARC,mid=a0+ARC/2;
        const cl=segColor(i,p.rarity);
        const g=c.createRadialGradient(cx,cy,R*.12,cx+R*.5*Math.cos(mid),cy+R*.5*Math.sin(mid),R);
        g.addColorStop(0,cl.g2);g.addColorStop(.65,cl.g1);g.addColorStop(1,cl.g1);
        c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R-2,a0,a1);c.closePath();
        c.fillStyle=g;c.fill();
        if(cl.border){c.beginPath();c.arc(cx,cy,R-5,a0+.02,a1-.02);c.strokeStyle=cl.border;c.lineWidth=p.rarity==='epic'?2.5:1.8;c.stroke()}
        c.beginPath();
        c.moveTo(cx+R*.18*Math.cos(a0),cy+R*.18*Math.sin(a0));
        c.lineTo(cx+(R-3)*Math.cos(a0),cy+(R-3)*Math.sin(a0));
        c.strokeStyle=`hsla(${H} 48% 58%/.07)`;c.lineWidth=1;c.stroke();

        // === ТЕКСТ — УВЕЛИЧЕН ===
        c.save();c.translate(cx,cy);c.rotate(mid);
        const label=p.label,parts=label.split(' ');
        const isM=parts.length>1&&label.length>5;

        // Увеличенные множители шрифта
        const fs=Math.round(S*(isM?.028:label.length>6?.033:.037));

        c.font=`${p.rarity==='epic'?900:p.rarity==='rare'?800:700} ${fs}px Montserrat,sans-serif`;
        c.fillStyle=cl.t;c.textAlign='center';c.textBaseline='middle';
        const tr=R*.55;
        c.save();c.translate(tr,0);
        if(isM){
            const lh=fs*1.15,lines=parts.length===2?parts:[parts[0],parts.slice(1).join(' ')];
            const sy=-(lines.length-1)*lh/2;
            lines.forEach((ln,li)=>c.fillText(ln,0,sy+li*lh));
        }else c.fillText(label,0,0);
        c.restore();c.restore();
    }
    c.beginPath();c.arc(cx,cy,cx-1.5,0,Math.PI*2);
    c.strokeStyle=`hsla(${H} 48% 60%/.05)`;c.lineWidth=1.5;c.stroke();
}

/* LEDs */
function initLEDs(){
    ledsEl.innerHTML='';ledA=[];
    const NL=PERF.leds,frag=document.createDocumentFragment();
    const rr=ledsEl.offsetWidth/2||190;
    for(let i=0;i<NL;i++){const a=(i/NL)*360,d=document.createElement('div');d.className='led';const rad=(a-90)*Math.PI/180;d.style.transform=`translate(${(rr-11)*Math.cos(rad)-2.5}px,${(rr-11)*Math.sin(rad)-2.5}px)`;frag.appendChild(d);ledA.push(d)}
    ledsEl.appendChild(frag);
}

let ledSpeed=30,ledRunning=false,ledLastT=0;
function ledsGo(spd){
    ledSpeed=spd;if(ledRunning)return;ledRunning=true;ledLastT=0;
    const NL=ledA.length,states=new Int8Array(NL);
    function loop(now){if(!ledRunning)return;if(!ledLastT)ledLastT=now;if(now-ledLastT>=ledSpeed){ledLastT=now;for(let i=0;i<NL;i++){const rel=((i-ledIdx%NL)+NL)%NL;let ns=0;if(rel<2)ns=1;else if(rel<4)ns=2;if(states[i]!==ns){states[i]=ns;const el=ledA[i];if(ns===1){el.classList.add('on');el.classList.remove('dim')}else if(ns===2){el.classList.remove('on');el.classList.add('dim')}else el.classList.remove('on','dim')}}ledIdx+=2}ledAnimId=requestAnimationFrame(loop)}
    ledAnimId=requestAnimationFrame(loop);
}
function ledsStop(){ledRunning=false;cancelAnimationFrame(ledAnimId);for(let i=0;i<ledA.length;i++)ledA[i].classList.remove('on','dim')}
function ledsHighlight(si){const NL=ledA.length,st=Math.floor(si*(NL/N)),cnt=Math.ceil(NL/N);for(let j=0;j<cnt;j++)ledA[(st+j)%NL].classList.add('on')}

/* DECOR INIT */
(function(){const el=$('stars'),frag=document.createDocumentFragment();for(let i=0;i<PERF.stars;i++){const s=document.createElement('div');s.className='star';const sz=1.5+Math.random()*1.5;s.style.width=sz+'px';s.style.height=sz+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--dur',(3+Math.random()*4)+'s');s.style.setProperty('--del',Math.random()*5+'s');frag.appendChild(s)}el.appendChild(frag)})();
(function(){const frag=document.createDocumentFragment();for(let i=0;i<PERF.rays;i++){const r=document.createElement('div');r.className='ray';r.style.transform=`rotate(${i*(360/PERF.rays)}deg)`;r.style.opacity=.06+Math.random()*.3;r.style.height=(120+Math.random()*65)+'px';frag.appendChild(r)}raysEl.appendChild(frag)})();
(function(){const frag=document.createDocumentFragment();for(let i=0;i<PERF.embers;i++){const e=document.createElement('div');e.className='ember';const sz=2+Math.random()*3;e.style.width=sz+'px';e.style.height=sz+'px';e.style.left=(10+Math.random()*80)+'%';e.style.bottom='-10px';e.style.setProperty('--edur',(4+Math.random()*6)+'s');e.style.setProperty('--edel',Math.random()*8+'s');e.style.setProperty('--edrift',(Math.random()*40-20)+'px');const hu=20+Math.random()*25;e.style.background=`hsla(${hu} 90% ${55+Math.random()*15}%/.6)`;e.style.boxShadow=`0 0 ${sz+2}px hsla(${hu} 80% 50%/.3)`;frag.appendChild(e)}flameEmbers.appendChild(frag)})();

/* CONFETTI */
let confettiP=[],confettiRun=false;
function fireConfetti(count,isGold=false){
    const pal=isGold?['#FFD700','#FFC107','#FFE082','#FFF8E1','#FFF']:currentThemeName==='flame'?['hsl(12,70%,65%)','hsl(35,80%,65%)','hsl(45,85%,70%)','hsl(0,60%,60%)','#fff']:currentThemeName==='neon'?['hsl(280,70%,70%)','hsl(170,70%,65%)','hsl(300,60%,75%)','hsl(180,65%,60%)','#fff']:[`hsl(${H},65%,75%)`,`hsl(${H},55%,60%)`,`hsl(${H},70%,85%)`,`hsl(${H},75%,92%)`,'#fff'];
    const cx=innerWidth/2,cy=innerHeight/2;
    for(let i=0;i<count;i++){const ang=Math.random()*Math.PI*2,vel=170+Math.random()*360;confettiP.push({x:cx,y:cy,vx:Math.cos(ang)*vel,vy:Math.sin(ang)*vel-170,w:2+Math.random()*5,h:2+Math.random()*8,rot:Math.random()*360,rotV:(Math.random()-.5)*13,color:pal[Math.floor(Math.random()*pal.length)],life:1,decay:.009+Math.random()*.01,gravity:260+Math.random()*160})}
    if(!confettiRun){confettiRun=true;let lastT=performance.now();function loop(now){const dt=Math.min((now-lastT)/1e3,.05);lastT=now;fxCtx.clearRect(0,0,innerWidth,innerHeight);for(let i=confettiP.length-1;i>=0;i--){const p=confettiP[i];p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;p.rot+=p.rotV;p.life-=p.decay;if(p.life<=0){confettiP.splice(i,1);continue}fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.rot*Math.PI/180);fxCtx.globalAlpha=Math.min(p.life,1);fxCtx.fillStyle=p.color;fxCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fxCtx.restore()}if(confettiP.length>0)requestAnimationFrame(loop);else{confettiRun=false;fxCtx.clearRect(0,0,innerWidth,innerHeight)}}requestAnimationFrame(loop)}
}

/* STARDUST */
let sdP=[],sdRun=false;
function addSD(){if(!PERF.particles)return;const r=whWrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;for(let i=0;i<2;i++){const a=Math.random()*Math.PI*2,rr=rad*(.72+Math.random()*.28),fa=a+(Math.random()-.5)*.4,fd=25+Math.random()*70;sdP.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,vx:Math.cos(fa)*fd,vy:Math.sin(fa)*fd,size:1+Math.random()*2,life:1,decay:.02+Math.random()*.02})}}
function runSD(){if(sdRun)return;sdRun=true;let lastT=performance.now();function loop(now){const dt=Math.min((now-lastT)/1e3,.05);lastT=now;pCtx.clearRect(0,0,innerWidth,innerHeight);for(let i=sdP.length-1;i>=0;i--){const p=sdP[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=p.decay;if(p.life<=0){sdP.splice(i,1);continue}pCtx.globalAlpha=p.life*.7;pCtx.fillStyle='#fff';pCtx.beginPath();pCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);pCtx.fill()}if(sdP.length>0)requestAnimationFrame(loop);else{sdRun=false;pCtx.clearRect(0,0,innerWidth,innerHeight)}}requestAnimationFrame(loop)}

/* THEMES */
const themeH={cosmos:218,flame:12,neon:280};
document.querySelectorAll('.theme-btn').forEach(btn=>{btn.addEventListener('click',()=>{if(isSpinning)return;document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const t=btn.dataset.theme;currentThemeName=t;document.body.dataset.theme=t;H=themeH[t]||218;drawWheel();setAmbientTheme(t);haptic('light')})});

/* API */
async function requestSpin(){try{const r=await fetch(API_URL+'/wheel/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});if(!r.ok){const err=await r.json();if(err.error==='already_spun'){tg.showAlert('⏰ Вы уже крутили сегодня!\nПриходите завтра.');err.next_spin_at?startCountdown(err.next_spin_at):countdownToMidnight()}else tg.showAlert('Ошибка: '+(err.message||'попробуйте позже'));return null}return await r.json()}catch(e){console.error(e);tg.showAlert('Нет связи с сервером');return null}}
async function checkCanSpin(){try{const r=await fetch(API_URL+'/wheel/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});const d=await r.json();if(!d.can_spin){showSpinUsed();d.next_spin_at?startCountdown(d.next_spin_at):countdownToMidnight()}else showSpinReady()}catch(e){console.error(e);showSpinReady()}}

/* EASING */
function spinEase(t){if(t<.12){const p=t/.12;return .12*(p*p*p)}const p=(t-.12)/.88;return .12+.88*(1-Math.pow(1-p,4.5))}

/* SPIN */
function spinWheel(winIdx){
    isSpinning=true;btnSp.disabled=true;ring.classList.add('glow');energyRing.classList.add('on');haptic('med');
    const rOff=(.12+Math.random()*.76)*SEG_DEG,pAng=winIdx*SEG_DEG+rOff;
    let ts=((360-pAng)%360+360)%360;
    const cn=((currentAngle%360)+360)%360,fr=5+Math.floor(Math.random()*3);
    let d=ts-cn;if(d<=0)d+=360;d+=fr*360;
    const ta=currentAngle+d,sa=currentAngle,st=performance.now(),dur=4800+Math.random()*1500;
    let lastSeg=-1;ledsGo(28);

    function animate(now){
        const el=now-st,pr=Math.min(el/dur,1),ea=spinEase(pr),sp=1-ea;
        currentAngle=sa+(ta-sa)*ea;rotor.style.transform=`rotate(${currentAngle}deg)`;
        ledSpeed=Math.max(20,85*sp);setAmbientIntensity(sp);
        if(PERF.particles&&sp>.06&&pr<.92){addSD();runSD()}
        const na=((currentAngle%360)+360)%360,cs=Math.floor(na/SEG_DEG);
        if(cs!==lastSeg){lastSeg=cs;const b=(2+Math.random()*2.5)*Math.min(sp*2.2,1);ptr.style.transform=`translate3d(-50%,0,0) rotate(${b}deg)`;setTimeout(()=>{ptr.style.transform=`translate3d(-50%,0,0) rotate(${-b*.2}deg)`;setTimeout(()=>ptr.style.transform='translate3d(-50%,0,0)',30)},18);playTick(sp);if(sp>.2)haptic('light')}
        if(pr<1)requestAnimationFrame(animate);else onSpinEnd(winIdx);
    }
    requestAnimationFrame(animate);
}

function onSpinEnd(winIdx){
    isSpinning=false;ledsStop();ring.classList.remove('glow');energyRing.classList.remove('on');
    ledsHighlight(winIdx);ptr.style.transform='translate3d(-50%,0,0)';setAmbientIntensity(0);
    const prize=PRIZES[winIdx],isEpic=prize.rarity==='epic',isRare=prize.rarity==='rare';
    if(isEpic){flash.style.background='radial-gradient(circle at center,hsla(45 90% 70%/.16),transparent 70%)';flash.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:500});burst.classList.add('on');raysEl.classList.add('on');haptic('success');playWin('epic');fireConfetti(PERF.confetti*2,true);setTimeout(()=>fireConfetti(PERF.confetti),170);if(navigator.vibrate)navigator.vibrate([80,40,150,40,220])}
    else if(isRare){flash.style.background='radial-gradient(circle at center,hsla(45 90% 70%/.1),transparent 70%)';flash.animate([{opacity:0},{opacity:.65},{opacity:0}],{duration:380});burst.classList.add('on');raysEl.classList.add('on');haptic('success');playWin('rare');fireConfetti(Math.floor(PERF.confetti*1.3));fireConfetti(Math.floor(PERF.confetti*.6),true)}
    else{flash.style.background=`radial-gradient(circle at center,hsla(${H} 70% 80%/.08),transparent 70%)`;flash.animate([{opacity:0},{opacity:.25},{opacity:0}],{duration:230});haptic('med');playWin('common');fireConfetti(PERF.confetti)}
    countdownToMidnight();showSpinUsed();
    setTimeout(()=>showModal(prize),isEpic?550:isRare?420:230);
    setTimeout(()=>{tg.sendData(JSON.stringify({action:'wheel_result',prize_id:prize.id,prize_index:winIdx}))},100);
}

async function onSpinClick(){if(isSpinning||!canSpin)return;canSpin=false;initAudio();initAmbient();const result=await requestSpin();if(!result){canSpin=true;return}spinWheel(result.prize_index)}
btnSp.addEventListener('click',onSpinClick);

const rMeta={common:{tag:'🎁 Ваш приз',tc:'',label:'Обычный'},rare:{tag:'💎 Редкий приз!',tc:'r',label:'Редкий'},epic:{tag:'🏆 Эпический приз!',tc:'r',label:'Эпический'}};
function showModal(prize){const m=rMeta[prize.rarity]||rMeta.common;mEmoji.textContent=prize.emoji||'🎁';mEmoji.style.animation='none';requestAnimationFrame(()=>{mEmoji.style.animation=''});mTag.textContent=m.tag;mTag.className='m-tag'+(m.tc?' '+m.tc:'');mVal.textContent=prize.label;mVal.className='m-val '+(prize.rarity!=='common'?'rv':'cv');mBadge.textContent=`${prize.d} D · ${m.label}`;mBadge.className='m-badge '+prize.rarity;mSub.textContent=prize.desc;mOv.classList.add('open')}
function closeModal(){mOv.classList.remove('open');burst.classList.remove('on');raysEl.classList.remove('on')}
mBtn.addEventListener('click',closeModal);mOv.addEventListener('click',e=>{if(e.target===mOv)closeModal()});

let resizeT;
addEventListener('DOMContentLoaded',()=>{resizeFx();initCv();initLEDs();checkCanSpin()});
addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{resizeFx();if(!isSpinning){const s=currentAngle;initCv();initLEDs();rotor.style.transform=`rotate(${s}deg)`}},200)},{passive:true});
</script>
